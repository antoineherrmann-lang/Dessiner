<style>
:root{
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light; --stage:#dde1e6; --paper:#fdfdfb;
  --glass:rgba(248,250,253,.40); --glass-panel:rgba(248,250,253,.58); --glass-strong:rgba(248,250,253,.74); --glass-brd:rgba(255,255,255,.70);
  --raise:rgba(255,255,255,.66); --hi:rgba(255,255,255,.95); --hi2:rgba(255,255,255,.34);
  --ink:#1d2024; --ink2:#6a7079; --line:rgba(30,40,55,.11); --fill:rgba(120,130,145,.16);
  --accent:#2e6a96; --accent-soft:rgba(46,106,150,.15); --danger:#c0392b; --seg-on:#fff;
  --shadow:0 8px 28px rgba(20,35,55,.16), 0 1px 2px rgba(20,35,55,.08);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--stage);
  font:15px/1.35 "Google Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#stage canvas{position:absolute;left:0;top:0;pointer-events:none}

/* ---------- verre ---------- */
.glass{background-color:var(--glass);
  background-image:linear-gradient(140deg,var(--hi2) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,var(--hi2) 100%);
  -webkit-backdrop-filter:saturate(165%) blur(16px) brightness(1.03);backdrop-filter:saturate(165%) blur(16px) brightness(1.03);
  border:1px solid var(--glass-brd);border-radius:26px;
  box-shadow:var(--shadow),inset 0 1.5px 0 var(--hi),inset 0 -1px 0 var(--hi2),inset 0 0 18px var(--hi2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background-color:var(--glass-strong)} }
#expanel.glass,#layers.glass,#toast.glass,#sheet.glass{background-color:var(--glass-panel)}
#sheet.glass{background-color:var(--glass-strong)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.flip{transform:scaleX(-1)}

/* ---------- barre du haut ---------- */
#topbar{position:absolute;z-index:10;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);
  height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:28px;height:28px;border-radius:7px;display:block;box-shadow:0 0 0 1px var(--line)}
.brand span{font-size:17px;font-weight:600;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--fill);border-radius:14px;padding:3px;gap:2px;box-shadow:inset 0 1px 2px rgba(20,35,55,.10)}
.seg button{height:34px;padding:0 14px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 1px 0 var(--hi)}
.seg.sm button{height:30px;padding:0 11px;font-size:13px}
.seg.full{display:flex}.seg.full button{flex:1}
.actions{display:flex;align-items:center;gap:0}
.ag{display:flex;align-items:center;gap:1px;position:relative}
.ag+.ag{margin-left:7px;padding-left:7px}
.ag+.ag::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:1px;background:var(--line)}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--accent-soft)}
.ib[disabled]{opacity:.28;pointer-events:none}

@media (max-width:760px){ .brand span{display:none} }
@media (max-width:640px){ #btnFit,#btnRedo{display:none} .ag+.ag{margin-left:5px;padding-left:5px} }
@media (max-width:520px){ .brand{display:none} #topbar{justify-content:space-between;padding:0 6px;gap:6px} .seg button{padding:0 8px;font-size:13px} .ib{width:36px;height:36px} .ag+.ag{margin-left:3px;padding-left:3px} }
@media (max-width:430px){ #btnLib{display:none} .ag+.ag{margin-left:0;padding-left:0} .ag+.ag::before{display:none} }
@media (max-width:360px){ .seg button{padding:0 7px} }
@media (max-width:340px){ #topbar{gap:3px;padding:0 4px} .ib{width:34px;height:34px} .seg button{padding:0 6px;font-size:12.5px} #btnLay{display:none} }
.narrow-only{display:none}
@media (max-width:520px){ .narrow-only{display:inline-flex} }

/* ---------- dock d'outils : bas en portrait, gauche en paysage ---------- */
#dock{position:absolute;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);
  max-width:calc(100% - 24px - var(--sal) - var(--sar));display:flex;flex-direction:row;align-items:center;gap:8px;padding:6px 10px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-radius:26px}
#dock::-webkit-scrollbar{display:none}
#dock .grp{display:flex;flex-direction:row;align-items:center;gap:3px;flex:none}
#dock .sep{width:1px;height:26px;background:var(--line);flex:none}
.tool{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--ink)}
.tool.on{background:var(--accent);color:#fff}
.size{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.size i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.size.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.swatch{--sw:clamp(28px,calc((100vw - 461px) / 10),38px);width:var(--sw);height:var(--sw);border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.swatch i{display:block;width:calc(var(--sw) * .72);height:calc(var(--sw) * .72);border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
.swatch.custom i{background:conic-gradient(from 0deg,#ff3b30,#ff9f0a,#ffd60a,#30d158,#0a84ff,#bf5af2,#ff375f,#ff3b30)}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

@media (orientation:landscape){
  #dock{left:calc(var(--sal) + 12px);top:calc(var(--sat) + 74px);bottom:auto;transform:none;flex-direction:column;
    max-width:none;max-height:calc(100% - var(--sat) - var(--sab) - 86px);padding:10px 6px;overflow-x:hidden;overflow-y:auto}
  #dock{align-items:center}
  #dock .grp{flex-direction:column}
  #dock #grpColors{display:grid;grid-template-columns:repeat(2,auto);gap:3px}
  .swatch{--sw:36px}
  #dock .sep{width:26px;height:1px}
}

/* ---------- panneau exercice ---------- */
#expanel{position:absolute;z-index:9;display:none;top:calc(var(--sat) + 74px);left:50%;transform:translateX(-50%);
  width:min(620px,calc(100% - 24px - var(--sal) - var(--sar)));padding:14px 16px 14px}
#expanel.show{display:block;max-height:calc(100% - var(--sat) - var(--sab) - 86px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
@media (orientation:landscape){
  #expanel{left:auto;right:calc(var(--sar) + 12px);transform:none;width:308px}
}
.ex-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.ex-h b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ex-p{margin:2px 0 10px;color:var(--ink2);font-size:14px}
.ex-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
/* boutons secondaires étroits, bouton principal large : si tout ne tient pas sur une ligne, l'action principale passe seule en dessous, pleine largeur */
.ex-row .btn{flex:1 1 auto;padding:0 10px}
.ex-row .btn.primary{flex:2 1 150px}
.score{display:flex;align-items:baseline;gap:6px;font-size:54px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:18px;font-weight:600;color:var(--ink2);letter-spacing:0}
.stars{font-size:22px;letter-spacing:3px;color:var(--accent)}
.stars .off{color:var(--fill)}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.metrics div{background:var(--fill);border-radius:12px;padding:8px 10px}
.metrics b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.metrics span{font-size:12px;color:var(--ink2)}
.tip{margin:10px 0 0;font-size:14px}

/* ---------- boutons, feuilles ---------- */
.btn{height:44px;padding:0 18px;border-radius:14px;background:var(--fill);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{filter:brightness(.92)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.35;pointer-events:none}
#scrim{position:absolute;inset:0;z-index:40;background:rgba(10,15,20,.22);opacity:0;pointer-events:none;transition:opacity .18s}
#scrim.open{opacity:1;pointer-events:auto;-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
#sheet{position:absolute;z-index:41;left:50%;top:50%;transform:translate(-50%,-46%);scale:.95;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .36s var(--spring),scale .36s var(--spring);
  width:min(580px,calc(100% - 24px - var(--sal) - var(--sar)));max-height:calc(100% - var(--sat) - var(--sab) - 32px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;container-type:inline-size;
  padding:18px 18px 14px;border-radius:30px}
#sheet.wide{width:min(860px,calc(100% - 24px - var(--sal) - var(--sar)))}
#sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);scale:1}
#sheet h2{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.02em}
#sheet .sub{margin:0 0 12px;overflow-wrap:anywhere;color:var(--ink2);font-size:14px}
.sec{margin:16px 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;min-height:50px;border-bottom:1px solid var(--line)}
.row>label.t{flex:1 1 170px;min-width:0}
.row>.seg{max-width:100%}
.row:last-child{border-bottom:0}
.row label.t{font-size:15px}
.row .hint{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.row.btns{gap:8px;padding:8px 0}.row.btns .btn{flex:1 1 130px;min-width:0}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .18s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .3s var(--spring),width .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
.card{background:var(--fill);border-radius:18px;padding:12px 14px;min-width:0}
.card b{font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.card p{margin:2px 0 10px;font-size:13.5px;color:var(--ink2)}
.card .lv{display:flex;flex-wrap:wrap;gap:8px}
.card .lv .btn{flex:1 1 118px;min-width:0;height:42px;padding:0 12px;gap:6px;justify-content:space-between;background:var(--raise);box-shadow:inset 0 1px 0 var(--hi)}
.card .lv .btn em{font-style:normal;font-weight:500;color:var(--accent);letter-spacing:.5px;font-size:12.5px;white-space:nowrap}
.prog{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 2px;color:var(--ink2);font-size:14px}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
@container (min-width:600px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@container (max-width:330px){ .dgrid{grid-template-columns:minmax(0,1fr)} .prog{flex-wrap:wrap;gap:4px 14px} }

/* ---------- petits éléments ---------- */
#zoomhud{background-color:var(--glass-panel);position:absolute;z-index:12;left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;opacity:0;pointer-events:none;transition:opacity .2s}
#zoomhud.show{opacity:1}
#diag{position:absolute;z-index:12;display:none;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 86px);padding:8px 10px;border-radius:14px;
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;pointer-events:none}
#diag{background:var(--glass-panel)}
#diag.show{display:block}
@media (orientation:landscape){ #diag{left:calc(var(--sal) + 88px);bottom:calc(var(--sab) + 12px)} }
#toast{position:absolute;z-index:45;left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:18px;font-size:14px}
#toast.show{display:flex}
#toast.flash{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
@media (orientation:landscape) and (min-width:900px){#toast.flash{bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}}
#toast .btn{height:36px;padding:0 14px;font-size:14px}
.pill{flex:none;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--fill);border-radius:999px;padding:3px 10px;white-space:nowrap}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.metrics{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.steps{margin:10px 0 0}
.steps>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.steps>div:last-child{border-bottom:0}
.steps em{font-style:normal;color:var(--accent);letter-spacing:1px;margin-left:4px}
.bars{display:flex;gap:8px;height:54px;margin:10px 0 0}
.bar{position:relative;flex:1;background:var(--fill);border-radius:8px;overflow:hidden}
.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.78}
.bar u{position:absolute;left:0;right:0;height:2px;background:var(--accent);text-decoration:none}
.legend{margin-top:4px;font-size:12px;color:var(--ink2)}
.txt{width:100%;min-width:0;box-sizing:border-box;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--raise);padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;margin-top:8px}
.txt:focus{border-color:var(--accent)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.dcard{background:var(--fill);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dcard .thumb{display:grid;place-items:center;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#fdfdfb}
.dcard .thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.dmeta{display:flex;flex-direction:column;padding:0 4px;min-width:0}
.dmeta b{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta span{font-size:12px;color:var(--ink2)}
.dact{display:flex;flex-wrap:wrap;gap:6px}
.btn.sm{height:36px;padding:0 6px;font-size:13px;flex:1 1 56px;border-radius:11px;background:var(--raise);box-shadow:inset 0 1px 0 var(--hi);min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn.sm.danger.on{background:var(--danger);color:#fff}
label.btn{cursor:pointer}
#btnLay.on{background:var(--accent-soft);color:var(--accent)}
#layers{position:absolute;z-index:11;display:none;top:calc(var(--sat) + 74px);right:calc(var(--sar) + 12px);width:min(330px,calc(100% - 24px - var(--sal) - var(--sar)));
  max-height:calc(100% - var(--sat) - var(--sab) - 176px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:12px}
#layers.show{display:block}
@media (orientation:landscape){ #layers{max-height:calc(100% - var(--sat) - var(--sab) - 100px)} }
.lh{display:flex;align-items:center;gap:8px;margin:0 0 6px 4px}.lh b{flex:1;font-size:16px;font-weight:600}
.ib.sm{width:36px;height:36px;border-radius:12px}
.lr{display:flex;align-items:center;gap:4px;padding:3px;border-radius:14px}
.lr.on{background:var(--accent-soft)}
.lr>button{width:38px;height:46px;flex:none;display:grid;place-items:center;border-radius:10px}
.lr>button.lkd{color:var(--accent)}
.lr.off .ln,.lr.off .lt{opacity:.45}
.lsel{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:48px;padding:0 4px;border-radius:10px;cursor:pointer}
.lt{width:40px;height:40px;flex:none;border-radius:8px;background:#fdfdfb;box-shadow:inset 0 0 0 1px var(--line)}
.ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;font-weight:500}
.lrn{height:38px;margin:0;font-size:15px;flex:1}
.lx{padding:2px 6px 8px}
.lx .orow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.lx .orow b{min-width:42px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.lx input[type=range]{flex:1;min-width:0;height:32px;accent-color:var(--accent)}
.lacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.lacts .btn{height:36px;padding:0 4px;font-size:12.5px;border-radius:11px;background:var(--raise);box-shadow:inset 0 1px 0 var(--hi);min-width:0;overflow:hidden;text-overflow:ellipsis}
.lacts .btn.danger{color:var(--danger)}
@media (max-width:330px){ .lacts{grid-template-columns:repeat(2,minmax(0,1fr))} }
#btnRot{position:absolute;z-index:12;display:none;place-items:center;width:46px;height:46px;border-radius:50%;padding:0;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 88px);color:var(--accent)}
#btnRot.show{display:grid}
@media (orientation:landscape){ #btnRot{bottom:calc(var(--sab) + 14px)} }
/* ---------- mode main gauche : outils à droite, panneaux à gauche ---------- */
.lefty #topbar{flex-direction:row-reverse}
.lefty #layers,.lefty #btnRot{right:auto;left:calc(var(--sal) + 12px)}
@media (orientation:landscape){
  .lefty #dock{left:auto;right:calc(var(--sar) + 12px)}
  .lefty #expanel{right:auto;left:calc(var(--sal) + 12px)}
}
/* ---------- stockage ---------- */
.sbar{height:10px;border-radius:6px;background:var(--fill);overflow:hidden;margin:10px 0 8px}
.sbar i{display:block;height:100%;min-width:4px;background:var(--accent);border-radius:6px}
.sbar.warn i{background:var(--danger)}
.srow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-size:13.5px;color:var(--ink2);padding:3px 0}
.srow b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.swarn{margin:6px 0 0;padding:9px 12px;border-radius:12px;background:rgba(192,57,43,.12);color:var(--danger);font-size:13.5px}
#brushes{position:absolute;z-index:13;display:none;width:min(236px,calc(100% - 16px));max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:8px;border-radius:26px;background-color:var(--glass-panel)}
#brushes.show{display:block}
.br{display:flex;align-items:center;gap:10px;width:100%;height:54px;padding:0 8px;border-radius:17px;text-align:left}
.br.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.br canvas{flex:none;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.br span{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr,.gr{position:relative}
.lr.in{margin-left:20px;box-shadow:-2px 0 0 var(--line)}
.lr.cur{box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.lr.in.cur{box-shadow:-2px 0 0 var(--line),inset 0 0 0 1.5px var(--accent-soft)}
.gr{display:flex;align-items:center;gap:2px;padding:3px;border-radius:14px;margin-top:2px}
.gr.on{background:var(--accent-soft)}
.gr>button{width:38px;height:46px;flex:none;display:grid;place-items:center;border-radius:10px}
.gr>button.lkd{color:var(--accent)}
.gr>button.chev{width:30px}
.gr>button.chev .ic{transition:transform .15s}
.gr>button.chev.c .ic{transform:rotate(-90deg)}
.gr.off .ln,.gr.off .gi{opacity:.45}
.gi{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--fill);color:var(--ink2)}
.cnt{font-style:normal;flex:none;font-size:12px;font-weight:600;color:var(--ink2);background:var(--fill);border-radius:999px;padding:2px 8px}
.grip{width:34px!important;color:var(--ink2);cursor:grab;touch-action:none}
.grip:active{cursor:grabbing}
.lx.in{margin-left:20px}
.gx{padding:2px 6px 8px}
.gx .orow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.gx .orow b{min-width:42px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.gx input[type=range]{flex:1;min-width:0;height:32px;accent-color:var(--accent)}
.lacts .btn.wide{grid-column:1/-1}
.ll{position:relative;padding-bottom:10px}
.ll.dragging .lx,.ll.dragging .gx{display:none}
.lr.drag,.gr.drag{opacity:.3}
.dropline{position:absolute;right:8px;height:3px;border-radius:2px;background:var(--accent);pointer-events:none;display:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.gr.dropin{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.ghostrow{position:fixed;z-index:60;pointer-events:none;border-radius:14px;background:var(--glass-strong);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--accent);display:flex;align-items:center;gap:2px;padding:3px;transform:scale(1.02);opacity:.96;overflow:hidden}
.ghostrow>button{width:38px;height:46px;flex:none;display:grid;place-items:center}
#storBox .btn,#updBox .btn{white-space:normal;min-width:0;max-width:100%}
.updmsg{margin:8px 0 2px;padding:10px 12px;border-radius:12px;background:var(--fill);font-size:13.5px;line-height:1.35}
.updmsg b{font-weight:600}
.updmsg.new{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.updmsg.err{background:rgba(192,57,43,.12);color:var(--danger)}
.updmsg.busy::before{content:"";display:inline-block;width:11px;height:11px;margin-right:8px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- photo de référence ---------- */
#refpanel{position:absolute;z-index:11;display:none;top:calc(var(--sat) + 74px);right:calc(var(--sar) + 12px);width:min(330px,calc(100% - 24px - var(--sal) - var(--sar)));
  max-height:calc(100% - var(--sat) - var(--sab) - 176px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:12px;background-color:var(--glass-panel)}
#refpanel.show{display:block}
@media (orientation:landscape){ #refpanel{max-height:calc(100% - var(--sat) - var(--sab) - 100px)} }
.lefty #refpanel{right:auto;left:calc(var(--sal) + 12px)}
.rp-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13.5px;color:var(--ink2)}
.rp-row>span{flex:0 0 74px}
.rp-row input[type=range]{flex:1;min-width:0;height:30px;accent-color:var(--accent)}
.rp-row b{flex:0 0 44px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.rp-row.stack{display:block}
.rp-row.stack>span{display:block;margin-bottom:4px}
.rp-row .seg{display:flex;width:100%;min-width:0}
.rp-row .seg button{flex:1;min-width:0;padding:0 2px;font-size:13px}
.rp-sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 2px;font-size:14.5px}
.rp-hint{margin:4px 2px 8px;font-size:13px;color:var(--ink2);line-height:1.35}
#refpanel .row.btns{margin-top:6px}
#refpanel .btn{height:40px;padding:0 10px;font-size:14px;flex:1;min-width:0}
#refpanel .btn.danger{color:var(--danger)}
/* ---------- dessin gestuel (dans le panneau d'exercice) ---------- */
.gp{display:grid;gap:10px}
.gp-l{display:grid;gap:10px;min-width:0}
.gp-top{display:flex;align-items:center;gap:14px}
.gp-ring{position:relative;width:74px;height:74px;flex:none}
.gp-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gp-ring circle{fill:none;stroke-width:7}
.gp-ring .bg{stroke:var(--fill)}
.gp-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .2s}
.gp-ring.warn .fg{stroke:var(--danger)}
.gp-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.gp-meta{min-width:0;flex:1}
.gp-meta b{display:block;font-size:16px;font-weight:600}
.gp-meta span{display:block;color:var(--ink2);font-size:13.5px}
.gp-subject{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.gp-photo{display:block;width:100%;max-height:32vh;object-fit:contain;border-radius:12px;background:var(--fill);cursor:zoom-in}
.gp .ex-row{margin-top:0;flex-wrap:wrap}
.gp .ex-row .btn{flex:1 1 84px;height:40px;padding:0 6px;font-size:14.5px}
#gpZoom{position:fixed;z-index:48;inset:0;display:grid;place-items:center;background:rgba(18,20,24,.93);cursor:zoom-out;padding:12px}
#gpZoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
@media (orientation:landscape) and (max-height:480px){
  #expanel.show:has(.gp){width:372px}
  .gp.has-photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
  .gp-photo{max-height:34vh}
  .gp-ring{width:54px;height:54px} .gp-ring b{font-size:15px}
  .gp-subject{font-size:18px}
}
@media (orientation:portrait){ .gp.has-photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center} .gp-photo{max-height:24vh} }
/* ---------- timelapse ---------- */
.tl-cv{display:block;width:100%;height:auto;max-height:44vh;object-fit:contain;border-radius:14px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);margin-top:8px}
.tl-ctl{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.tl-ctl .btn{flex:none;height:40px;padding:0 14px}
.tl-ctl .btn .ic{width:18px;height:18px}
.tl-ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.tl-time{flex:none;min-width:78px;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* ---------- nouveautés ---------- */
.news-h{display:flex;align-items:baseline;gap:8px;margin:16px 0 2px;font-size:15.5px;font-weight:700}
.vtag{font-size:12px;font-weight:600;color:var(--ink2);background:var(--fill);border-radius:999px;padding:2px 9px}
ul.news{list-style:none;margin:0;padding:0}
ul.news li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
ul.news li:last-child{border-bottom:0}
ul.news li b{display:block;font-weight:600;font-size:14.5px}
ul.news li span{color:var(--ink2)}
#toast .btn.sm{height:34px;padding:0 12px;font-size:13.5px}
/* ---------- exercices en onglets ---------- */
.extabs{display:flex;gap:6px;overflow-x:auto;margin:10px -2px 4px;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.extabs::-webkit-scrollbar{display:none}
.extab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;padding:8px 14px 9px;border-radius:16px;background:var(--fill);text-align:left;box-shadow:inset 0 1px 0 var(--hi)}
.extab small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.extab b{font-size:14px;font-weight:650;white-space:nowrap}
.extab i{display:block;margin-top:4px;width:100%;height:3px;border-radius:2px;background:rgba(127,127,127,.22);overflow:hidden}
.extab i u{display:block;height:100%;border-radius:2px;background:var(--accent);text-decoration:none;transition:width .5s var(--ease)}
.extab.on{background:var(--accent);color:#fff}.extab.on small{color:rgba(255,255,255,.8)}.extab.on i{background:rgba(255,255,255,.3)}.extab.on i u{background:#fff}
.expane{animation:fadein .26s var(--ease) both}
.expane .intro{margin:6px 2px 0;font-size:13px;color:var(--ink2)}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exhead .prog{margin:2px 0}
/* ---------- 0.9.0 : dégradé, gomme fine, taille précise ---------- */
.gd-end{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:2px 0 2px}
.gd-sw{position:relative;aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14);display:grid;place-items:center}
.gd-sw.none{background-image:linear-gradient(45deg,#cfd4da 25%,transparent 25%,transparent 75%,#cfd4da 75%),linear-gradient(45deg,#cfd4da 25%,#fff 25%,#fff 75%,#cfd4da 75%);background-size:10px 10px;background-position:0 0,5px 5px}

<script>
'use strict';
const APP_VERSION = "1.3.0";

const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rd = v => Math.round(v * 100) / 100;

/*==PURE-START==*/
/* Noyau sans DOM (testé sous Node) : géométrie, scores, constructions des exercices. */
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

   Cadavre exquis : la feuille est pliée en bandes, on ne voit que sa bande et le raccord de la précédente
   ===================================================================== */

  if (a === 'next') return mpGo('rules');
  if (a === 'n') { c.n = clamp(c.n + +d.d, 2, 8); MPUI.picker = -1; mpSave(); return mpRender(true); }
  if (a === 'avatar') { MPUI.picker = MPUI.picker === +d.i ? -1 : +d.i; MPUI.pickFresh = true; mpRender(true); MPUI.pickFresh = false; return; }
  if (a === 'pick') {
    const i = +d.i, other = c.players.findIndex((p, k) => k !== i && p.av === d.av);
    if (other >= 0) c.players[other].av = c.players[i].av; c.players[i].av = d.av; MPUI.picker = -1; mpSave(); return mpRender(true);
  }
  if (a === 'rand') { const names = shuffle(MP_NAMES); for (let i = 0; i < c.n; i++) c.players[i].name = names[i]; mpSave(); return mpRender(true); }
  if (a === 'themes') { c.themes = clamp(c.themes + +d.d, 1, 10); mpSave(); return mpRender(true); }
  if (a === 'set') {
    const k = d.k, v = d.val; if (k === 'page' && c.mode === 'corpse') c.pageC = v; else c[k] = ['dur', 'laps', 'ghost', 'parts'].includes(k) ? +v : v; mpSave(); return mpRender(true);
  }
  if (a === 'start') return mpStart();
  if (a === 'menu') return mpMenu();
  if (a === 'ready') { if (MP && MP.phase === 'pass' && !MP.paused) mpPlay(); return; }
  if (a === 'tab') return mpTab(+d.i);
  if (a === 'zoom') { const R = MPR, r = +d.r, list = R.players.map((pl, i) => R.res[r].shots[i] ? { img: R.res[r].shots[i].img, title: pl.name, sub: R.themes[r], color: pl.color, av: pl.av, i } : null).filter(Boolean); return mpZoom(list, Math.max(0, list.findIndex(x => x.i === +d.i))); }
  if (a === 'zoomstep') { const R = MPR, r = +d.r, list = R.res[r].steps.map((s, k) => ({ img: s.img, title: R.players[s.p].name, sub: `${R.themes[r]} · étape ${k + 1}`, color: R.players[s.p].color, av: R.players[s.p].av })); return mpZoom(list, +d.i); }
  if (a === 'zprev') return mpZoomShift(-1);
  if (a === 'znext') return mpZoomShift(1);
  if (a === 'zclose') { mpZoomEl.hidden = true; MPUI.zoom = null; return; }
  if (a === 'heart') {
    const R = MPR, r = +d.r, i = +d.i; R.fav[r] = R.fav[r] === i ? -1 : i;
    $('#mpBody').querySelectorAll('.mp-heart').forEach(h => { const on = R.fav[r] === +h.dataset.i; h.classList.toggle('on', on); h.setAttribute('aria-pressed', on); });
    b.classList.remove('burst'); void b.offsetWidth; if (R.fav[r] === i) { b.classList.add('burst'); mpTone(784, 0.1); } return;
  }
  if (a === 'unfold') return mpUnfold(+d.r, false);
  if (a === 'unfoldall') return mpUnfold(+d.r, true);
  if (a === 'tl') return mtlOpen(+d.r);
  if (a === 'tlclose') return mtlClose();
  if (a === 'tlplay') return mtlPlay();
  if (a === 'tlexp') return mtlExport();
  if (a === 'tlsave') { if (MTL.blob) deliverFile(MTL.blob, `${slug(MTL.title) || 'partie'}-timelapse.${MTL.blob.type.includes('mp4') ? 'mp4' : 'webm'}`, 'Timelapse'); return; }
  if (a === 'tldur') { if (MTL.exporting) return; MTL.dur = +d.val; mtlInvalidate(); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); MTL.t = Math.min(MTL.t, MTL.dur); mtlRender(MTL.t); mtlUI(); return; }
  if (a === 'save') return mpSaveAll();
  if (a === 'again') { MPR = null; mpEl.classList.remove('is-pass'); return mpGo('rules', -1); }
  if (a === 'leave') return mpLeave();
});
mpEl.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mtlSl') { if (MTL.exporting) return; MTL.playing = false; cancelAnimationFrame(MTL.raf); MTL.t = t.value / 1000 * MTL.dur; mtlRender(MTL.t); mtlUI(); mtlPlayBtn(); return; }
  if (t.dataset.mpname !== undefined) { mpCfg.players[+t.dataset.mpname].name = t.value.slice(0, 14); mpSave(); }
  else if (t.id === 'mpCustom') { mpCfg.custom = t.value.slice(0, 600); mpSave(); const h = $('#mpCustomHint'); if (h) h.textContent = mpCustomHint(); }
});
mpEl.addEventListener('change', e => { const o = e.target.dataset.mpopt; if (o) { mpCfg[o] = e.target.checked; mpSave(); } });
document.addEventListener('keydown', e => {
  if (!mpEl.classList.contains('show') || mpZoomEl.hidden) return;
  if (e.key === 'ArrowLeft') mpZoomShift(-1); else if (e.key === 'ArrowRight') mpZoomShift(1); else if (e.key === 'Escape') { mpZoomEl.hidden = true; MPUI.zoom = null; }
});
/* barre de la partie */
$('#mphUndo').addEventListener('click', () => doUndo()); $('#mphRedo').addEventListener('click', () => doRedo());
$('#mphMenu').addEventListener('click', () => mpMenu());
$('#mphDone').addEventListener('click', () => {
  const g = MP, b = $('#mphDone'); if (!g || g.phase !== 'play') return;
  if (g.armed) { g.armed = false; b.classList.remove('armed'); b.textContent = 'Fini'; return mpEndTurn(); }
  g.armed = true; b.classList.add('armed'); b.textContent = 'Sûr ?';
  setTimeout(() => { if (MP === g && g.armed) { g.armed = false; b.classList.remove('armed'); b.textContent = 'Fini'; } }, 2400);
});

/* rebond des boutons « allumés » : seulement quand on vient de les toucher, jamais quand un panneau se redessine tout seul */
document.addEventListener('click', e => {
  const b = e.target && e.target.closest && e.target.closest('button,label'); if (!b) return;
  const at = [...b.attributes].filter(a => a.name.startsWith('data-')).map(a => `[${a.name}="${CSS.escape(a.value)}"]`).join(''), sel = at ? b.tagName.toLowerCase() + at : (b.id ? '#' + CSS.escape(b.id) : '');
  requestAnimationFrame(() => {
    const el = b.isConnected ? b : (sel ? document.querySelector(sel) : null);
    if (!el || !el.classList.contains('on') || !settings.anim) return;
    el.classList.remove('fx'); void el.offsetWidth; el.classList.add('fx'); setTimeout(() => el.classList.remove('fx'), 420);
  });
}, true);
init();
