/* =====================================================================
   Nouveautés : affichées une fois après une mise à jour, consultables dans les réglages
   ===================================================================== */
const CHANGELOG = [
  { v: '1.14.0', date: '12 nov. 2026', items: [
    ['Formes parfaites sur tous les traits', 'Garde le stylet immobile à la fin d’un trait : même si ce n’est ni une droite ni un cercle, il devient plus net. Un arc devient un arc parfait, une courbe libre une courbe lissée qui garde sa forme et ses extrémités, une boucle irrégulière une forme fermée lisse. Les droites, cercles, rectangles, triangles… marchent comme avant. Réglage « Lisser tous les autres traits » dans Lissage et formes parfaites.'],
    ['Couleurs : la roue tout de suite', 'Le panneau couleur s’ouvre directement sur la roue des couleurs, avec un curseur de luminosité et le nuancier de la couleur choisie. Le bouton couleur du dock complet est plus large, de la taille de deux pastilles.']] },
  { v: '1.13.2', date: '11 nov. 2026', items: [
    ['Ouverture d’un carnet sans clignotement', 'Quand tu touches un carnet dans ton portfolio, c’est maintenant le vrai livre qui glisse de l’étagère jusqu’au centre avant de s’ouvrir : il n’y a plus de copie à raccorder, donc plus de saut entre l’animation et l’ouverture. À la fermeture, la carte de l’étagère apparaît dans la même image que la fin du glissement.']] },
  { v: '1.13.1', date: '10 nov. 2026', items: [
    ['Pages qui tournent : plus de traits gris', 'Chaque lamelle de la page qui se plie avait par erreur une ombre sur son bord, ce qui dessinait des bandes verticales grises. La page se courbe maintenant sans aucune marque.'],
    ['Transition vers un carnet', 'Le titre de la couverture ne change plus de taille ni de police en cours de route : la police se perdait pendant le glissement et la couverture n’avait pas les mêmes proportions à toutes les échelles. Elle est maintenant identique de l’étagère jusqu’au plein écran.'],
    ['Étagère de carnets', 'L’encart « Nouveau carnet » est aligné en haut avec les autres carnets.'],
    ['Comparer', 'En mode Comparer, tous tes dessins sont visibles, même ceux rangés dans un carnet (le nom du carnet est indiqué sous chaque dessin).']] },
  { v: '1.13.0', date: '9 nov. 2026', items: [
    ['Pages qui se plient pour de vrai', 'Quand tu tournes une page, elle se courbe comme du papier : le bord libre traîne puis se détend en retombant, avec une ombre et un reflet qui suivent la courbure. Le mouvement part doucement, prend de l’élan et retombe longuement.'],
    ['Passage carnet ⇄ portfolio sans coupure', 'La fermeture du carnet est plus rapide (les pages repartent en cascade, la couverture se ferme dès qu’elles sont passées), puis le livre fermé glisse jusqu’à sa place sur l’étagère pendant que le portfolio apparaît. À l’ouverture, le carnet se lève de l’étagère et glisse jusqu’au centre avant de s’ouvrir.'],
    ['Écran de lancement', 'Un écran animé s’affiche au démarrage : des traits colorés se dessinent, une barre suit les vraies étapes du chargement, puis l’app apparaît dans un fondu flou. Il suit le thème clair ou sombre.']] },
  { v: '1.12.0', date: '8 nov. 2026', items: [
    ['Carnet en pleine page', 'Le carnet occupe tout l’écran : une barre fine en haut (retour au portfolio, nom, menu ⋯) et une en bas (dessin, page, Reprendre). Modifier, Ajouter, Sortir un dessin et Supprimer sont dans le menu ⋯. Touche le milieu d’une page pour masquer les barres. En portrait, une seule grande page.'],
    ['Le blanc dans les couleurs de base', 'Le blanc rejoint la palette, juste à côté du noir.'],
    ['Boîte à outils', 'Dessin, Animation et Multijoueur sont sur la même ligne, sans la lueur colorée.']] },
  { v: '1.11.2', date: '7 nov. 2026', items: [
    ['Carnet : flou progressif au pliage', 'Quand la couverture ou un feuillet se plie autour de la charnière, il est net près du dos et de plus en plus flou vers son bord libre, d’autant plus que le pli est marqué. Pendant l’ouverture et la fermeture, la mise au point se perd un instant puis se refait. Si tu choisis « Effets de verre légers » dans Réglages, le flou est coupé.']] },
  { v: '1.11.1', date: '6 nov. 2026', items: [
    ['Portfolio sans clignotement', 'Quand tu filtres, tries ou choisis des dessins, la fenêtre ne s’éclaircit plus d’un coup à chaque clic, et le défilement reste en place quand tu choisis un dessin. Les vignettes s’affichent sans flash, et les effets de survol (carte qui se soulève) ne restent plus « collés » après un toucher sur l’iPad.'],
    ['Carnet : croix en double et espacement', 'Il y avait deux croix superposées en haut à droite du carnet ouvert : il n’y en a plus qu’une. Le bouton Portfolio n’est plus collé au titre.']] },
  { v: '1.11.0', date: '5 nov. 2026', items: [
    ['Carnets', 'Dans Mes dessins, une étagère de carnets. Crée un carnet (nom et couverture au choix), puis range-y des dessins : avec « Ranger » pour en choisir plusieurs d’un coup, ou avec l’icône carnet de chaque dessin. Un dessin est seul ou dans un seul carnet. Touche un carnet : il s’ouvre comme un vrai livre, la couverture pivote et la double page s’écarte. Tourne les feuillets en les tirant du doigt, en tapant sur leur bord ou avec les flèches. Les carnets sont inclus dans la sauvegarde complète.'],
    ['Dessins en feuillets', 'Les dessins seuls ressemblent maintenant à des feuilles de papier, avec un coin replié qui se soulève quand on les touche.']] },
  { v: '1.10.3', date: '3 nov. 2026', items: [
    ['Fausse alerte de mise à jour corrigée', 'L’app pouvait annoncer une version plus ancienne que la tienne (par exemple 1.9 alors que tu avais la 1.10) quand le fichier version.json du dépôt n’avait pas été mis à jour. Elle compare maintenant les numéros comme des nombres : elle ne propose que des versions plus récentes, et ignore un version.json périmé.'],
    ['Remplissage plus fluide et plus élégant', 'Avec le pot de peinture, ou en glissant une couleur sur le dessin, la peinture s’étale maintenant depuis le point touché, bornée à la zone, avec une ligne de lumière au front de la vague. Plus la zone est grande, plus la vague dure longtemps. Annuler en cours de route est sans danger, et l’animation se coupe avec le réglage « Animations ».']] },
  { v: '1.10.2', date: '2 nov. 2026', items: [
    ['Glisser une couleur pour remplir', 'Maintiens le doigt ou le Pencil sur une couleur (palette, couleur actuelle ou couleurs récentes) : une goutte de couleur se détache et te suit, avec un repère à l’endroit exact. Lâche-la sur le dessin et la zone en dessous est remplie, comme avec le pot de peinture, avec ses réglages de tolérance. Un tap normal choisit toujours la couleur. Tu peux couper ce geste dans Réglages, Dessin.']] },
  { v: '1.10.1', date: '1 nov. 2026', items: [
    ['Le bouton pour remettre les outils passe à gauche', 'Quand l’interface est masquée, la petite pastille pour annuler, rétablir et tout rafficher est maintenant en haut à gauche. En mode main gauche, elle reste en haut à droite.']] },
  { v: '1.10.0', date: '31 oct. 2026', items: [
    ['Gestes au doigt, dans l’esprit de Procreate', 'Reste appuyé avec deux doigts pour annuler en continu (trois doigts pour rétablir). Maintiens un doigt sur la feuille : une loupe prélève la couleur. Pince vite pour recadrer la feuille. Tape avec quatre doigts pour masquer ou afficher l’interface. Glisse trois doigts vers le bas pour un menu rapide : copier la feuille, coller, dupliquer ou effacer le calque. Chaque geste se règle dans Réglages, Dessin.'],
    ['Réglages de pinceau', 'Chaque pinceau a son opacité, sa dynamique (l’effet de la pression et de la vitesse sur l’épaisseur) et son effilé (début et fin du trait), avec un aperçu en direct. Les réglages sont gardés pinceau par pinceau, avec un bouton pour revenir aux valeurs d’origine. Tant que tu n’y touches pas, les pinceaux existants se comportent exactement comme avant.'],
    ['Trois nouveaux pinceaux', 'Encre (fine, sensible à la pression, début et fin effilés), Plat sec (pointe plate à poils secs, trait griffé) et Aérographe (bords doux).']] },
  { v: '1.9.2', date: '30 oct. 2026', items: [
    ['Atelier 3D retiré', 'L’Atelier 3D (volumes, lumière, formes perso) disparaît, avec son moteur 3D. L’app est deux fois plus légère à télécharger (650 Ko au lieu de 1 300) et ne prépare plus ce moteur en arrière-plan à chaque lancement.'],
    ['Démarrage et mises à jour plus rapides', 'Les polices Google ne bloquent plus l’affichage : avant, une connexion lente retardait tout le démarrage. Si le serveur tarde plus d’une seconde et demie, l’app s’ouvre tout de suite depuis sa copie en cache. La vérification de mise à jour télécharge quelques octets au lieu de toute l’app.'],
    ['Effets de verre légers et diagnostic', 'Nouveau réglage « Effets de verre » (Complets ou Légers) : le flou des barres et des panneaux demande de la puissance à l’écran. Dans Réglages, À propos, « Mesurer » teste la fluidité de ton appareil et te dit quel réglage choisir.'],
    ['Morphing de la barre d’outils refait', 'Entre complet et mini, la boîte change vraiment de taille, les boutons qui partent sont aspirés par l’outil actif et ceux qui arrivent en jaillissent en cascade, au lieu de se superposer à une copie de l’ancienne barre.']] },
  { v: '1.9.1', date: '29 oct. 2026', items: [
    ['Des transitions plus organiques', 'Passer d’un état des outils à l’autre est maintenant une vraie animation. Entre complet et mini, la barre se resserre ou s’étire en douceur, l’outil actif et la couleur glissent à leur nouvelle place avec un petit effet de ressort, et les boutons qui arrivent jaillissent l’un après l’autre. Pour masquer ou rafficher l’interface, les barres glissent hors de l’écran ou y reviennent, et la pastille rebondit. Le menu ⋯ s’ouvre de la même façon. Si tu coupes « Animations » dans Réglages, tout reste instantané.']] },
  { v: '1.9.0', date: '28 oct. 2026', items: [
    ['Mode sombre', 'Nouveau réglage « Apparence » (Réglages, Affichage) : Auto suit l’iPad, ou Clair, ou Sombre. L’interface passe au sombre, mais la feuille reste blanche : tes couleurs ne sont jamais faussées. Tous les écrans ont été vérifiés (contraste, panneaux, Mes dessins, calques, animation). Dans l’Atelier 3D, le fond de studio reste clair, pour que les photos de référence ne changent pas.'],
    ['Outils : complets, mini ou masqués', 'Deux boutons en haut de la barre d’outils. Le premier la réduit en mode mini : l’outil actif, ⋯ pour changer d’outil, la taille et la couleur. Le second masque tout pour dessiner en plein écran : plus d’outils ni de barre du haut, seulement une petite pastille pour annuler, rétablir et tout rafficher. La feuille se recadre en douceur, et ton zoom manuel est respecté. Le choix se fait aussi dans Réglages, Affichage, et il est gardé.'],
    ['Animation : la feuille ne passe plus sous la barre', 'Sur iPad en paysage, le bas de la feuille se cachait sous la barre d’animation. Elle se cadre maintenant au-dessus.']] },
  { v: '1.8.5', date: '27 oct. 2026', items: [
    ['Apprentissage retiré', 'La section Apprentissage (exercices guidés, notes et étoiles) disparaît : la barre du haut ne garde que Dessin, Atelier 3D, Animation et Jeux multijoueur. Le dessin gestuel reste dans Tous les outils, et tes anciens dessins d’exercice restent dans Mes dessins.'],
    ['Texte : espace, courbe, ombre', 'Trois nouveaux curseurs dans le panneau du texte : l’espacement des lettres (resserré ou aéré), la courbe (le texte épouse un arc vers le haut ou vers le bas) et une ombre douce. Tout se combine, s’enregistre, se déplace et s’aplatit en image sans rien couper.']] },
  { v: '1.8.4', date: '26 oct. 2026', items: [
    ['L’aimant se voit enfin', 'Le bouton aimant ne montrait pas s’il était actif. Il est maintenant coloré quand l’aimant est actif et barré quand il est coupé, et chaque appui affiche un message (« Aimant activé » ou « Aimant coupé »). On le retrouve aussi dans le panneau du texte, et son état est le même partout.']] },
  { v: '1.8.3', date: '25 oct. 2026', items: [
    ['Déplacer un calque : un vrai bouton « Valider »', 'Pour valider la position d’un calque, il n’y avait qu’une petite croix sans libellé : on ne comprenait pas qu’elle validait. La barre a maintenant un bouton « Valider » bien visible, à côté d’« Annuler ». La croix fait la même chose que « Valider ».']] },
  { v: '1.8.2', date: '24 oct. 2026', items: [
    ['Déformation de calque : fluide et fiable', 'L’aperçu est dessiné par la carte graphique et passe en demi-résolution pendant que tu déplaces une poignée ou que tu zoomes : plus de saccades. On ne peut plus croiser les coins (le coin glisse jusqu’à la limite), la poignée suit ton doigt sans sauter, la feuille se recadre toute seule si les poignées sont hors de l’écran, et un double appui sur « Appliquer » ne crée plus rien en double. Changer d’espace, ouvrir un menu ou annuler termine proprement la déformation.'],
    ['Panneau des calques simplifié', 'Les neuf boutons de texte du calque actif sont remplacés par dix tuiles à icône sur deux rangées (un groupe : quatre tuiles sur une rangée). Chaque ligne ne garde que l’œil, le nom et la poignée ; le cadenas n’apparaît que sur un calque bloqué, pour le débloquer d’un toucher (le bloquer se fait dans les tuiles).']] },
  { v: '1.8.1', date: '23 oct. 2026', items: [
    ['Couleur libre pour le texte', 'Dans le panneau du texte, la roue de couleurs à la suite des pastilles permet de choisir n’importe quelle couleur, avec un aperçu en direct sur la feuille. La couleur choisie s’affiche au centre de la roue et rejoint tes couleurs récentes.'],
    ['« Aplatir »', 'Le bouton « Aplatir en image » s’appelle simplement « Aplatir » ; il fait toujours la même chose : le texte devient une image sur son propre calque.']] },
  { v: '1.8.0', date: '22 oct. 2026', items: [
    ['Du texte sur la feuille', 'Nouveau bouton T dans la barre d’outils (et dans Tous les outils). Touche la feuille pour écrire : dix polices, gras, italique, alignement, contour, couleur et taille. Le texte se déplace, s’agrandit et se tourne comme une image, avec l’aimant au centre et aux bords. Touche-le à nouveau pour le modifier à tout moment ; tu peux aussi le dupliquer ou le supprimer.'],
    ['Aplatir le texte en image', 'Quand le texte te convient, « Aplatir en image » le transforme en vraie image sur son propre calque (à son nom) : le rendu ne change pas, et une annulation le rend de nouveau modifiable.'],
    ['Déformer un calque', 'Nouveau bouton « Déformer le calque » (panneau des calques, Tous les outils, menu de l’animation). En Perspective, tu tires les 4 coins pour une vraie perspective ; en Gondoler, 9 poignées courbent le calque en douceur. Miroirs horizontal et vertical, Réinitialiser, aperçu en direct, puis Appliquer (une seule étape d’historique). La croix ferme sans appliquer.']] },
  { v: '1.7.6', date: '21 oct. 2026', items: [
    ['Mes dessins : les derniers tout en haut', 'Les dessins étaient rangés colonne par colonne : le haut de la deuxième et de la troisième colonne montrait des dessins bien plus anciens. Désormais les plus récents occupent tout le haut, de gauche à droite, puis les suivants juste dessous. La fiche à la une est plus compacte pour que les dessins apparaissent dès le premier écran.'],
    ['Plus fluide, sans clignotement', 'Les images nettes se calculaient toutes à l’ouverture, en plein défilement, puis remplaçaient les vignettes d’un coup. Elles sont maintenant gardées sur l’appareil (calculées une seule fois), préparées seulement pour ce qui est proche de l’écran et quand plus rien ne bouge, puis posées sans clignoter. En revenant d’une fiche, tu retrouves ta place dans la liste.']] },
  { v: '1.7.5', date: '20 oct. 2026', items: [
    ['Une croix jusqu’au bout', 'Il manquait encore la croix en haut à droite sur trois écrans : le panneau des exercices (elle quitte les exercices), la barre de pose d’une image (elle ferme sans poser) et la barre de déplacement d’un calque (elle ferme en gardant le déplacement ; « Terminé » disparaît, « Annuler le déplacement » reste). Désormais, partout, la croix est au même endroit.'],
    ['« Enregistrer puis continuer » continue de nouveau', 'Depuis la 1.7.4, après avoir enregistré un dessin dans la fenêtre « Dessin non enregistré », l’app n’enchaînait plus sur ce que tu avais demandé (nouvelle feuille, ouvrir un autre dessin). C’est corrigé.']] },
  { v: '1.7.4', date: '19 oct. 2026', items: [
    ['Une croix partout', 'Tous les menus se ferment maintenant de la même façon : une croix ronde en haut à droite, au même endroit et de la même taille. Les boutons « Fermer », « Terminé » et « Annuler » du bas disparaissent : Réglages, Tous les outils, Nouveautés, Exercices, les dialogues, les options de l’animation, l’éditeur de forme 3D et le panneau de l’Atelier (qui se masque et se rouvre d’un bouton).']] },
  { v: '1.7.3', date: '18 oct. 2026', items: [
    ['La coche « Symétrie active » marche', 'Le curseur des interrupteurs interceptait le toucher : la symétrie ne se coupait plus et restait active à ton insu. C’est corrigé pour tous les interrupteurs de l’app. Le dessin avec symétrie est aussi bien plus léger : une feuille chargée se redessine plus vite (zoom, annulation, déplacement).'],
    ['Des menus qui apparaissent toujours de la même façon', 'Les grandes fenêtres (Tous les outils, Réglages) ne glissent plus en diagonale depuis un coin : elles se déploient depuis leur centre. Les panneaux grandissent depuis leur bouton, et au changement d’espace plus rien n’arrive de la gauche, de la droite ou du bas : un simple fondu.'],
    ['Une image, un calque', 'Importer, coller ou glisser une image crée automatiquement un calque à son nom, sans case à cocher : tu peux la déplacer ou la masquer seule. Plusieurs images donnent plusieurs calques.']] },
  { v: '1.7.2', date: '17 oct. 2026', items: [
    ['Des traits qui ne sautent plus', 'Les stylos, feutres et pinceaux ne bougent plus quand on lève le stylet : ce que tu vois pendant le tracé est exactement ce qui reste, même avec un lissage à 200 %. Les gestes rapides ne forment plus d’angles, l’épaisseur varie en douceur, et la pointe rejoint le stylet par une fin progressive au lieu d’un crochet.'],
    ['Plus aucun à-coup pendant que tu dessines', 'La sauvegarde automatique et les vignettes de l’animation attendent que le stylet soit levé : elles ne bloquent plus l’écran au milieu d’un trait.'],
    ['Fermer l’app sans rien perdre', 'Les dernières lignes d’une animation étaient perdues si l’app se fermait trop vite : tout est maintenant écrit en quittant, en changeant d’espace ou en passant en arrière-plan, et un trait en cours est conservé.'],
    ['Déplacer un calque', 'Un nouveau bouton dans le panneau des calques (et dans Tous les outils) : déplacer, agrandir et tourner tout le contenu d’un calque, à un doigt, à deux doigts ou avec les poignées. En Animation, une image ou toutes les images d’un coup. Annulable d’un seul geste.'],
    ['Centrage et aimants pour les images', 'En posant une image ou en déplaçant un calque, un aimant s’accroche au centre et aux bords de la feuille et aux autres éléments, avec des repères visibles. Boutons Centrer, Ajuster et Aimant. Chaque image peut arriver sur son propre calque, pour la déplacer seule ensuite.']] },
  { v: '1.7.1', date: '16 oct. 2026', items: [
    ['Textes plus lisibles', 'Dans les Réglages et les autres fenêtres, chaque ligne a enfin de l’air : les descriptions ne collent plus aux traits de séparation. Le titre de Mes dessins ne mord plus sur la ligne du dessous, les noms d’œuvres tiennent sur deux lignes, les boutons du panneau Couleur et les onglets des petits écrans ne débordent plus.']] },
  { v: '1.7.0', date: '15 oct. 2026', items: [
    ['Symétrie', 'Un nouveau bouton dans le dock : verticale, horizontale, en croix, radiale (2 à 16 branches) ou kaléidoscope. Chaque trait se reflète en direct ; glisse le point central au doigt pour déplacer l’axe.'],
    ['Export GIF', 'Dans les options de l’animation : un GIF animé qui tourne en boucle, à la cadence choisie, avec ou sans la photo de fond.'],
    ['Formes perso repensées', 'Dans l’Atelier 3D, la forme apparaît tout de suite dans la scène et se modifie en direct dans le panneau : une courbe lisse dont on déplace, ajoute ou retire les points, ou que l’on redessine à main levée. Révolution à facettes ou haut fermé, extrusion symétrique aux bords arrondis, douze modèles, et « Modifier la forme » pour y revenir plus tard.']] },
  { v: '1.6.0', date: '14 oct. 2026', items: [
    ['La règle', 'Un nouveau bouton dans le dock pose une règle sur la feuille : un doigt la déplace, deux doigts la tournent (aimantée tous les 15°). Un trait commencé près d’un de ses bords le suit parfaitement droit.'],
    ['Images sur la feuille', 'Dans « Tous les outils » : insère plusieurs images d’un coup, colle une image (ou ⌘V au clavier), ou glisse-dépose des fichiers. Les PNG gardent leur transparence. Chaque image se place avant d’être posée : la déplacer, l’agrandir, la tourner (à deux doigts ou avec les poignées), la retourner. Elle rejoint ensuite le calque actif.'],
    ['Atelier 3D plus léger', 'Navigation à deux doigts plus réactive : glisser pour tourner autour, pincer pour zoomer, pivoter les doigts pour faire tourner la scène, avec un léger élan. Le rendu s’allège pendant le geste et l’ombre n’est plus recalculée quand seule la vue bouge.'],
    ['Nouvelle animation', 'Les choix ne débordent plus de leurs boutons.']] },
  { v: '1.5.3', date: '13 oct. 2026', items: [
    ['Animation : lecture et arrêt', 'Le bouton lecture répond toujours, et toucher un outil, la feuille ou une image arrête aussitôt la lecture. Le menu « … » retrouve son fond flou.'],
    ['Atelier 3D : navigation à plusieurs doigts', 'Un doigt sur un volume le déplace. Deux doigts pour tourner autour et zoomer, trois doigts pour déplacer la vue. Les boutons Déplacer, Tourner et Taille disparaissent (les réglages restent dans le panneau), et « Dessiner d’après cette vue » rejoint la barre du haut.'],
    ['Changements d’espace', 'En quittant l’Atelier 3D, plus aucune image de l’atelier ne réapparaît pendant la transition.'],
    ['Tous les outils', 'La fenêtre réunit enfin tout : les espaces, les outils de dessin (pinceaux, gomme, remplissage, grain, couleurs, pipette, lissage, trait en dégradé), la feuille, l’entraînement et le partage.'],
    ['Lissage jusqu’à 200 %', 'Au-delà de 100 %, un lissage extrême pour des courbes parfaitement régulières.']] },
  { v: '1.5.2', date: '12 oct. 2026', items: [
    ['Passages plus fluides', 'La barre des sections ne bouge plus d’un pixel d’un espace à l’autre, la pastille glisse sans à-coup et reste sur l’espace affiché (Jeux multijoueur compris). L’ancien espace se retire pendant que la vague monte, le nouveau arrive quand elle se retire. La vague est bien plus légère à afficher, et le moteur 3D se prépare en tâche de fond pour que l’atelier s’ouvre sans figer l’écran.']] },
  { v: '1.5.1', date: '11 oct. 2026', items: [
    ['Passer d’un espace à l’autre', 'Changer d’espace devient un geste continu : la pastille glisse sous l’onglet choisi, une vague d’encre aux couleurs du nouvel espace part de l’onglet et recouvre l’écran, puis se retire pendant que la feuille, le dock et les barres arrivent en douceur.'],
    ['Photo de fond dans l’Animation', 'Dans les options de l’animation : une photo sous toutes les images, en remplissage ou entière, avec son opacité, et présente ou non dans la vidéo exportée.']] },
  { v: '1.5.0', date: '10 oct. 2026', items: [
    ['Nouvelle barre des sections', 'En haut : Dessin, Atelier 3D, Animation, Apprentissage (les exercices) et Jeux multijoueur. Le menu Outils devient « Tous les outils ».'],
    ['Animation image par image', 'Une nouvelle section pour l’animation 2D : une frise d’images, la pelure d’oignon qui montre en transparence les images d’avant (rouge) et d’après (vert), une image qui repart des traits de la précédente, la lecture en boucle, la cadence, l’export en vidéo et l’enregistrement dans Mes dessins.'],
    ['Atelier 3D : formes perso et couleurs', 'Dessine un profil pour créer une forme de révolution (vase, verre…) ou un contour à extruder (étoile, cœur, lettre…). Nouveaux volumes : tore et demi-sphère. Chaque volume a sa couleur, sa matière (mate, satinée, brillante) et ses réglages de forme (côtés, haut, épaisseur).']] },
  { v: '1.4.0', date: '9 oct. 2026', items: [
    ['Atelier 3D (bêta)', 'Dans Outils : pose des volumes (cube, cylindre, sphère, cône, pyramide), éclaire-les avec une lampe orientable, choisis ton point de vue et ta focale. Ligne d’horizon, points de fuite, arêtes cachées en option. Un bouton envoie la vue en photo de référence pour la dessiner.'],
    ['Nouveaux exercices', 'Quatre nouveaux paliers : Animaux (chat, oiseau, poisson), Corps humain (proportions, ligne d’action, main), Visages (de face, de profil, l’œil) et Styles de dessin (manga, cartoon, portrait en une ligne). Les exercices trop simples ou redondants ont été fusionnés ou retirés.'],
    ['Le grain dans le menu du stylo', 'Le grain quitte le dock : il se choisit dans la grille des brosses, avec ses réglages dans le même panneau.']] },
  { v: '1.3.0', date: '8 oct. 2026', items: [
    ['Outil Grain', 'Un quatrième outil dans le dock : passe-le sur une partie du dessin pour lui donner de la matière. Sur le dessin seulement ou partout, en ombre, en lumière ou dans la couleur actuelle, grain fin à gros, quatre intensités.'],
    ['Aperçus en blanc', 'Avec une couleur très claire (blanc, jaune pâle…), les aperçus des brosses, de la taille et du trait en dégradé passent sur un fond sombre pour rester lisibles.'],
    ['Portfolio plus léger', 'Les titres du portfolio passent à Instrument Serif, une police fine et élégante, à la place de Fraunces.']] },
  { v: '1.2.0', date: '7 oct. 2026', items: [
    ['Gomme précise', 'La gomme efface exactement là où tu passes, même au milieu d’un trait, d’un aplat ou d’un dégradé, sur le calque actif. Taille de 2 à 200, force (100, 50 ou 25 %), sensible à la pression. L’ancienne gomme reste disponible en mode « Traits entiers ».'],
    ['Outils rangés', 'Trois outils dans le dock : Pinceau, Gomme et Remplissage (aplat ou dégradé réunis). Touche deux fois un outil pour ouvrir son panneau : tout ce qui le concerne y est rassemblé. Les cinq tailles du dock suivent l’outil actif.'],
    ['Un bouton Couleur', 'Roue des couleurs, pipette et couleurs récentes sont réunies derrière un seul bouton, à la suite de la palette. Le trait en dégradé se règle désormais dans le panneau du pinceau.'],
    ['Portfolio en Fraunces', 'Titres en Fraunces, gras et italique, mise en page affinée, et un mode « Comparer » pour mettre deux œuvres côte à côte.']] },
  { v: '1.1.0', date: '6 oct. 2026', items: [
    ['Lissage réglable', 'Un curseur de 0 à 100 remplace le stabilisateur, dans Réglages > Dessin et en bas du choix des brosses : de trait brut à très doux.'],
    ['Formes parfaites', 'En fin de trait, garde le Pencil immobile un instant : il devient une ligne droite, un cercle, une ellipse, un rectangle, un carré, un triangle ou un polygone. Sans relâcher, bouge pour l’agrandir ou le tourner. Temps d’arrêt réglable.'],
    ['Portfolio', 'Mes dessins devient un vrai portfolio plein écran : ta dernière œuvre à la une, un mur en colonnes au format de chaque dessin, des filtres par type, un tri, et une fiche détaillée pour chaque œuvre.']] },
  { v: '1.0.0', date: '5 oct. 2026', items: [
    ['Version 1.0', 'Dessiner passe en 1.0 : exercices, dessin libre, outils, multijoueur… tout est là, revu de bout en bout.'],
    ['Multijoueur : ambiance Braise', 'Une seule ambiance, la plus chaude : Braise. Le choix d’ambiance disparaît de l’accueil.'],
    ['Animations plus calmes', 'Les boutons ne rebondissent plus à chaque trait ou à chaque réglage : seulement quand tu les touches.'],
    ['Corrections', 'Le panneau du dessin gestuel ne se redessine plus à chaque trait, et plusieurs petits défauts relevés lors d’un tour complet de l’app sont corrigés.']] },
  { v: '0.12.1', date: '4 oct. 2026', items: [
    ['Multijoueur : retour d’« Aurore »', 'La première direction artistique revient : dégradés fluides sur fond d’encre, grain, verre et lueurs. Les trois ambiances (Aurore, Lagon, Braise) sont de nouveau au choix sur l’accueil, et chaque joueur reprend sa palette à son tour.']] },
  { v: '0.12.0', date: '4 oct. 2026', items: [
    ['Multijoueur : direction « Chrome liquide »', 'Fond noir profond, grandes formes lisses et brillantes en dégradé iridescent, interface très sobre. Chaque joueur a sa forme à sa couleur, qui ondule doucement à l’écran de passage. Aucun effet de lueur.']] },
  { v: '0.11.0', date: '3 oct. 2026', items: [
    ['Traits en dégradé', 'Un bouton près des couleurs : le trait passe d’une couleur à l’autre au fil de sa longueur, avec toutes les brosses sauf l’aquarelle. La couleur de fin est libre, avec réglage de la longueur et mode aller-retour.'],
    ['Dégradé de zone : couleur de fin libre', 'La seconde couleur n’est plus limitée à la palette : roue de couleurs, couleurs récentes, et un bouton pour inverser départ et fin.'],
    ['Multijoueur : nouvelle direction artistique', 'Un univers « atelier d’impression » : papier, encre, aplats vifs et trame de points, sans effets de lueur. Chaque joueur prend sa couleur à son tour. Le choix des ambiances disparaît.']] },
  { v: '0.10.0', date: '2 oct. 2026', items: [
    ['Pipette et couleurs récentes', 'Une pipette près des couleurs : touche ou glisse sur la feuille (photo de référence comprise) pour prendre une teinte, avec une loupe qui montre la couleur sous ton doigt. Les couleurs libres ou prélevées sont gardées dans la fenêtre « Couleurs ».'],
    ['Cadavre exquis', 'Un troisième mode multijoueur : chacun dessine une partie de la créature sans voir les autres, en ne devinant que le raccord du dessus. À la fin, on déplie le dessin partie par partie.'],
    ['Plus de mode sombre', 'L’app reste toujours en clair, quel que soit le réglage de l’iPad.']] },
  { v: '0.9.0', date: '1 oct. 2026', items: [
    ['Outil dégradé', 'Dans le dock : glisse dans une zone pour y étaler un dégradé, linéaire ou radial, vers une couleur ou vers la transparence. Un simple tap le place tout seul, et « Toute la feuille » remplit le fond.'],
    ['Taille précise', 'Un curseur à côté des cinq tailles règle l’épaisseur du trait au dixième près, avec un aperçu avec la brosse choisie.'],
    ['Brosses plus distinctes', 'Quatre nouvelles : Plume (pointe plate, pleins et déliés), Pinceau (très variable, effilé), Craie (trait sec) et Surligneur. Le Crayon a un vrai grain de graphite.'],
    ['Gomme fine', 'Précise par défaut, elle efface le trait entier dès qu’elle le touche, même en balayant vite. Touche-la une seconde fois pour choisir Fine, Moyenne ou Large.'],
    ['Exercices en onglets', 'Un onglet par palier avec sa progression, au lieu d’une longue liste.'],
    ['Timelapse en multijoueur', 'Rejoue la partie à la fin : le relais trait par trait avec le joueur qui dessine, ou tous les dessins d’un thème en même temps. Exportable en vidéo.'],
    ['Menus plus nets', 'Le flou des fenêtres et des panneaux est réduit.']] },
  { v: '0.8.1', date: '1 oct. 2026', items: [
    ['Multijoueur : nouvelle identité', 'Un univers à part, en dégradés fluides sur fond d’encre, avec du grain et du verre. Trois ambiances au choix sur l’accueil : Aurore, Lagon et Braise.'],
    ['Une palette par joueur', 'À chaque passage, tout l’écran prend les couleurs du joueur suivant. Sa barre de partie et le halo de la feuille aussi.'],
    ['Passage de tablette en 10 secondes', 'Le temps de passage passe de 5 à 10 secondes, avec un bouton « Je suis prêt » pour écourter l’attente.']] },
  { v: '0.8.0', date: '1 oct. 2026', items: [
    ['Mode multijoueur', 'Une vraie partie à plusieurs, dans Outils > Multijoueur : de 2 à 8 joueurs avec leur nom et leur avatar, de 1 à 10 thèmes, un chrono de 15 secondes à 10 minutes.'],
    ['Duel à l’aveugle', 'Même thème pour tous, chacun son tour, sans voir ce que font les autres. 5 secondes verrouillées entre deux joueurs pour passer la tablette, puis tous les dessins se découvrent côte à côte, avec coups de cœur et podium.'],
    ['Relais collaboratif', 'On se passe la feuille : chacun reprend le dessin du précédent et le rend meilleur. Les traits des autres peuvent passer en transparence, et le résultat se compare étape par étape.'],
    ['Et toujours', 'Les dessins de la partie peuvent être enregistrés dans Mes dessins. Ta feuille en cours n’est jamais touchée.']] },
  { v: '0.7.0', date: '30 sept. 2026', items: [
    ['Seau de peinture', 'Un nouvel outil dans le dock : touche une zone pour la remplir. Tolérance, fermeture des petits trous et lecture des calques se règlent en touchant le seau une seconde fois. La gomme retire un aplat d’un simple tap.'],
    ['Bouton Outils', 'Un bouton à part entière dans la barre du haut : feuille, photo de référence, dessin gestuel, exercices, timelapse et export, rangés par thème.'],
    ['Annuler et rétablir', 'Une discrète pastille confirme ce qui vient d’être annulé ou rétabli (trait, aplat, gommage…).'],
    ['Barre du haut rangée', 'Les boutons sont regroupés par fonction : feuille, historique, vue, puis Outils et Réglages.'],
    ['Réglages en onglets', 'Dessin, Affichage, Données et À propos : plus de longue liste mélangée.'],
    ['Animations', 'De petits effets sur les fenêtres, les boutons, les outils et les panneaux. Ils se coupent dans Réglages > Affichage, ou automatiquement si ton iPad demande moins d’animations.']] },
  { v: '0.6.0', date: '30 sept. 2026', items: [
    ['Photo de référence', 'Importe une photo : elle s’affiche en transparence sous ton dessin, en noir et blanc ou en 3 ou 5 tons pour lire les valeurs, avec un miroir pour repérer les erreurs. Bouton « image » en haut.'],
    ['Bouton +', 'Une nouvelle feuille en un geste, au même format que la feuille en cours. Maintiens le bouton pour choisir un autre format.'],
    ['Dessin gestuel', 'Des séances de poses chronométrées (30 s à 5 min) avec tes photos, des mots au hasard, ou sans sujet. Réglages > Outils.'],
    ['Timelapse', 'Rejoue ton dessin trait par trait et exporte la vidéo. Réglages > Outils.'],
    ['Nouveautés', 'Cette fenêtre s’ouvre après chaque mise à jour, et reste consultable dans les réglages.']] },
  { v: '0.5.1', date: '30 sept. 2026', items: [
    ['Recherche de mise à jour', 'Un bouton dans les réglages pour vérifier tout de suite si une nouvelle version existe.'],
    ['Nouvelles icônes', 'Un engrenage pour les réglages, un viseur pour recentrer la feuille.']] },
  { v: '0.5.0', date: '30 sept. 2026', items: [
    ['Pinceaux', 'Marqueur, fusain et aquarelle, dans un sélecteur près du dock.'],
    ['Groupes de calques', 'Glisser-déposer pour réordonner les calques et les ranger dans des groupes.'],
    ['Rotation de la feuille', 'Fais tourner la feuille à deux doigts ; elle s’aimante aux angles droits.'],
    ['Mode main gauche et stockage', 'Les outils passent à droite, et les réglages montrent l’espace utilisé.']] },
  { v: '0.4.0', date: '29 sept. 2026', items: [['Palette et calques', 'Nouvelle palette vive, panneau de calques, verre liquide affiné.']] },
  { v: '0.3.0', date: '28 sept. 2026', items: [['Mes dessins', 'Bibliothèque de dessins enregistrés, sauvegarde .json et police Google Sans.']] },
  { v: '0.2.0', date: '27 sept. 2026', items: [['Exercices par étapes', '21 exercices en 5 paliers, avec une note à chaque étape.']] }
];
const cmpVer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; };
const newsHtml = list => list.map(e => `<div class="news-h">Version ${esc(e.v)}<span class="vtag">${esc(e.date)}</span></div><ul class="news">${e.items.map(([t, d]) => `<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ul>`).join('');
function openNews(since) {
  const list = since ? CHANGELOG.filter(e => cmpVer(e.v, since) > 0 && cmpVer(e.v, APP_VERSION) <= 0).slice(0, 3) : CHANGELOG;
  if (!list.length) return false;
  openSheet(`<h2>${since ? 'Nouveautés' : 'Historique des versions'}</h2><p class="sub">${since ? `Dessiner vient de passer en version ${esc(APP_VERSION)}.` : `Version installée : ${esc(APP_VERSION)}.`}</p>${newsHtml(list)}
    <div class="row btns" style="margin-top:12px"><button class="btn primary" data-sheet="close">${since ? 'C’est noté' : 'Fermer'}</button></div>`);
  return true;
}
/* à décider dès le démarrage, avant toute action : installation neuve (rien à signaler) ou mise à jour d'une version d'avant les nouveautés */
async function initSeenVersion() {
  if (LS.get('seenVersion', null) !== null) return;
  let existing = S.docs.free.strokes.length > 0 || Object.keys(localStorage).some(k => k.startsWith('dessiner_') && k !== 'dessiner_seenVersion' && k !== 'dessiner_updLast');
  if (!existing) { try { existing = (await LIB.list()).length > 0; } catch (e) { } }
  LS.set('seenVersion', existing ? '0.5.1' : APP_VERSION);
}
function maybeShowNews() {
  const seen = LS.get('seenVersion', APP_VERSION), c = cmpVer(seen, APP_VERSION);
  if (c > 0) { LS.set('seenVersion', APP_VERSION); return; }
  if (c === 0) return;
  if (sheet.classList.contains('open') || G || MP || mpEl.classList.contains('show')) return;    /* on ne passe pas devant une autre fenêtre : ce sera pour la prochaine ouverture */
  openNews(seen); LS.set('seenVersion', APP_VERSION);
}

/* =====================================================================
   Liaison des nouveaux boutons
   ===================================================================== */
function bindExtra() {
  bindNewButton();

}
const dfPlace = () => { if (DF.on) dfDraw(); };                                  /* appelé à chaque rendu de la feuille (zoom, déplacement) : l'aperçu suit sans retard */
const dfSchedule = () => { if (DF.on && !DF.raf) DF.raf = requestAnimationFrame(dfDraw); };      /* poignées : au plus un dessin par image écran */
window.dfProbe = (wx, wy) => { DF.vs = ''; DF.drag = null; dfDraw(); const s = toScreen(wx, wy), o = DF.org || [0, 0], Q = DF.q || DPR, t = document.createElement('canvas'); t.width = t.height = 1; const c = t.getContext('2d'); try { c.drawImage(dfCv, Math.round((s[0] - stageLeft) * Q - o[0]), Math.round((s[1] - stageTop) * Q - o[1]), 1, 1, 0, 0, 1, 1); } catch (e) { return [0, 0, 0, 0]; } const q = c.getImageData(0, 0, 1, 1).data; return [q[0], q[1], q[2], q[3]]; };
/* ---------- poignées : un doigt ou le stylet ; la poignée garde sa distance au doigt (pas de saut) ---------- */
dfHs.addEventListener('pointerdown', e => {
  const hb = e.target.closest('.df-h'); if (!hb || !DF.on || DF.busy) return; e.preventDefault(); e.stopPropagation(); try { hb.setPointerCapture(e.pointerId); } catch (err) { }
  const k = +hb.dataset.k, p = DF.mode === 'persp' ? DF.Q[k] : DF.G[Math.floor(k / 3)][k % 3], w = toWorld(e.clientX, e.clientY); DF.drag = { id: e.pointerId, k, off: [p[0] - w[0], p[1] - w[1]] }; hb.classList.add('grab');
});
dfHs.addEventListener('pointermove', e => {
  if (!DF.drag || DF.drag.id !== e.pointerId) return; const w = toWorld(e.clientX, e.clientY); dfMoveTo(DF.drag.k, [w[0] + DF.drag.off[0], w[1] + DF.drag.off[1]]); dfRemap(); dfSchedule();
});
const dfUp = e => { if (DF.drag && DF.drag.id === e.pointerId) { DF.drag = null; DF.bad = false; dfHs.querySelectorAll('.grab').forEach(h => h.classList.remove('grab')); dfSchedule(); } };
dfHs.addEventListener('pointerup', dfUp); dfHs.addEventListener('pointercancel', dfUp);
function dfSwitch(m) {                                                         /* on change de type sans que l'image saute : les points de départ sont ceux d'avant */

/* ---------- appliquer : le maillage est dessiné à pleine résolution, puis devient l'image du calque ---------- */
async function dfApply() {
  if (!DF.on || DF.busy) return; const d = DF.d, L = layerById(d, DF.ids[0]); if (!L) return dfClose();

  const W = d.page.w, H = d.page.h; bx0 = Math.max(bx0, -0.25 * W); by0 = Math.max(by0, -0.25 * H); bx1 = Math.min(bx1, 1.25 * W); by1 = Math.min(by1, 1.25 * H);

  try {
    const s = Math.min(DF.s, 4096 / Math.max(bx1 - bx0, by1 - by0), Math.sqrt(14e6 / ((bx1 - bx0) * (by1 - by0)))), cv = document.createElement('canvas'); cv.width = Math.max(1, Math.ceil((bx1 - bx0) * s)); cv.height = Math.max(1, Math.ceil((by1 - by0) * s));

    else { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; dfMesh2D(c2.getContext('2d'), DF.bmp, N, toDest); out = c2; }
    const reg = await imgRegisterCanvas(out);                                  /* la lecture du dessin se fait tout de suite, avant que le navigateur ne le recompose */
    if (H2) { try { const e = H2.gl.getExtension('WEBGL_lose_context'); if (e) e.loseContext(); } catch (err) { } }
    if (!reg) { flash('Impossible de déformer ce calque.'); return; }
    const before = snapshot(d), im = { id: reg.id, cx: (bx0 + bx1) / 2, cy: (by0 + by1) / 2, w: bx1 - bx0, h: by1 - by0, rot: 0, flip: false };
    d.strokes = d.strokes.filter(t => t.layer !== L.id); d.strokes.push({ tool: 'image', color: '#000000', alpha: 1, layer: L.id, im, p: imgCorners(im) }); L.rev = (L.rev || 0) + 1;
    DF.busy = false; dfEl.classList.remove('busy'); dfClose(false); pushOp({ k: 'snap', before, after: snapshot(d) }); requestRender(); markDirty(); if (typeof refreshLayers === 'function') refreshLayers(); flash(S.mode === 'anim' ? 'Image déformée' : 'Calque déformé');
  } finally { DF.busy = false; dfEl.classList.remove('busy'); }
}
dfEl.addEventListener('click', e => {
  const b = e.target.closest('[data-df]'); if (!b || !DF.on) return; const a = b.dataset.df; if (DF.busy) return;
  if (a === 'persp' || a === 'warp') return dfSwitch(a);
  if (a === 'flipx') { DF.fx = !DF.fx; return dfDraw(); }
  if (a === 'flipy') { DF.fy = !DF.fy; return dfDraw(); }
  if (a === 'reset') { DF.mode = 'persp'; dfDefault(); dfSyncUI(); dfBuildHandles(); return dfDraw(); }
  if (a === 'cancel') { dfClose(true); return flash('Déformation annulée'); }
  if (a === 'ok') return dfApply();
});
/* ---------- une seule session d'édition à la fois : changer d'espace, ouvrir un menu, annuler… la termine proprement ---------- */
function closeEditSessions() {
  if (typeof TX !== 'undefined' && TX.on) txClose();
  if (typeof LM !== 'undefined' && LM.on) lmClose(true);
  if (DF.on && !DF.busy) dfClose(true);
}
