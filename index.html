<style>
:root{
  --stage:#dde1e6; --paper:#fdfdfb;
  --glass:rgba(248,250,253,.40); --glass-panel:rgba(248,250,253,.58); --glass-strong:rgba(248,250,253,.74); --glass-brd:rgba(255,255,255,.70);
  --raise:rgba(255,255,255,.66); --hi:rgba(255,255,255,.95); --hi2:rgba(255,255,255,.34);
  --ink:#1d2024; --ink2:#6a7079; --line:rgba(30,40,55,.11); --fill:rgba(120,130,145,.16);
  --accent:#2e6a96; --accent-soft:rgba(46,106,150,.15); --danger:#c0392b; --seg-on:#fff;
  --shadow:0 8px 28px rgba(20,35,55,.16), 0 1px 2px rgba(20,35,55,.08);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --stage:#101316;
    --glass:rgba(40,46,54,.42); --glass-panel:rgba(32,37,44,.70); --glass-strong:rgba(28,33,40,.82); --glass-brd:rgba(255,255,255,.14);
    --raise:rgba(255,255,255,.12); --hi:rgba(255,255,255,.30); --hi2:rgba(255,255,255,.08);
    --ink:#eef0f3; --ink2:#9aa2ad; --line:rgba(255,255,255,.11); --fill:rgba(150,160,175,.20);
    --accent:#6aaee0; --accent-soft:rgba(106,174,224,.20); --danger:#ff7a6b; --seg-on:rgba(255,255,255,.16);
    --shadow:0 8px 28px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  }
  .swatch i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.30)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--stage);
  font:15px/1.35 "Google Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#stage canvas{position:absolute;left:0;top:0;pointer-events:none}

/* ---------- verre ---------- */
.glass{background-color:var(--glass);
  background-image:linear-gradient(140deg,var(--hi2) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,var(--hi2) 100%);
  -webkit-backdrop-filter:saturate(190%) blur(30px) brightness(1.04);backdrop-filter:saturate(190%) blur(30px) brightness(1.04);
  border:1px solid var(--glass-brd);border-radius:26px;
  box-shadow:var(--shadow),inset 0 1.5px 0 var(--hi),inset 0 -1px 0 var(--hi2),inset 0 0 18px var(--hi2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background-color:var(--glass-strong)} }
#expanel.glass,#layers.glass,#toast.glass,#sheet.glass{background-color:var(--glass-panel)}
#sheet.glass{background-color:var(--glass-strong)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.flip{transform:scaleX(-1)}

/* ---------- barre du haut ---------- */
#topbar{position:absolute;z-index:10;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);
  height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:28px;height:28px;border-radius:7px;display:block;box-shadow:0 0 0 1px var(--line)}
.brand span{font-size:17px;font-weight:600;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--fill);border-radius:14px;padding:3px;gap:2px;box-shadow:inset 0 1px 2px rgba(20,35,55,.10)}
.seg button{height:34px;padding:0 14px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 1px 0 var(--hi)}
.seg.sm button{height:30px;padding:0 11px;font-size:13px}
.seg.full{display:flex}.seg.full button{flex:1}
.actions{display:flex;align-items:center;gap:2px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--accent-soft)}
.ib[disabled]{opacity:.28;pointer-events:none}

@media (max-width:700px){ .brand span{display:none} }
@media (max-width:520px){ .brand{display:none} #topbar{justify-content:space-between;padding:0 6px;gap:6px} .seg button{padding:0 8px;font-size:13px} .ib{width:36px;height:36px} #btnFit,#btnRedo,#btnRef{display:none} }
@media (max-width:620px){ #btnFit,#btnRedo,#btnRef{display:none} }
@media (max-width:430px){ #btnLib{display:none} }
@media (max-width:360px){ .seg button{padding:0 7px} }
@media (max-width:340px){ #topbar{gap:3px;padding:0 4px} .ib{width:34px;height:34px} .seg button{padding:0 6px;font-size:12.5px} }
.narrow-only{display:none}
@media (max-width:520px){ .narrow-only{display:inline-flex} }

/* ---------- dock d'outils : bas en portrait, gauche en paysage ---------- */
#dock{position:absolute;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);
  max-width:calc(100% - 24px - var(--sal) - var(--sar));display:flex;flex-direction:row;align-items:center;gap:8px;padding:6px 10px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-radius:26px}
#dock::-webkit-scrollbar{display:none}
#dock .grp{display:flex;flex-direction:row;align-items:center;gap:3px;flex:none}
#dock .sep{width:1px;height:26px;background:var(--line);flex:none}
.tool{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--ink)}
.tool.on{background:var(--accent);color:#fff}
.size{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.size i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.size.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.swatch{--sw:clamp(28px,calc((100vw - 461px) / 10),38px);width:var(--sw);height:var(--sw);border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.swatch i{display:block;width:calc(var(--sw) * .72);height:calc(var(--sw) * .72);border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
.swatch.custom i{background:conic-gradient(from 0deg,#ff3b30,#ff9f0a,#ffd60a,#30d158,#0a84ff,#bf5af2,#ff375f,#ff3b30)}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

@media (orientation:landscape){
  #dock{left:calc(var(--sal) + 12px);top:calc(var(--sat) + 74px);bottom:auto;transform:none;flex-direction:column;
    max-width:none;max-height:calc(100% - var(--sat) - var(--sab) - 86px);padding:10px 6px;overflow-x:hidden;overflow-y:auto}
  #dock{align-items:center}
  #dock .grp{flex-direction:column}
  #dock #grpColors{display:grid;grid-template-columns:repeat(2,auto);gap:3px}
  .swatch{--sw:36px}
  #dock .sep{width:26px;height:1px}
}

/* ---------- panneau exercice ---------- */
#expanel{position:absolute;z-index:9;display:none;top:calc(var(--sat) + 74px);left:50%;transform:translateX(-50%);
  width:min(620px,calc(100% - 24px - var(--sal) - var(--sar)));padding:14px 16px 14px}
#expanel.show{display:block}
@media (orientation:landscape){
  #expanel{left:auto;right:calc(var(--sar) + 12px);transform:none;width:308px}
}
.ex-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.ex-h b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ex-p{margin:2px 0 10px;color:var(--ink2);font-size:14px}
.ex-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.ex-row .btn{flex:1;min-width:0;padding:0 8px}
.score{display:flex;align-items:baseline;gap:6px;font-size:54px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:18px;font-weight:600;color:var(--ink2);letter-spacing:0}
.stars{font-size:22px;letter-spacing:3px;color:var(--accent)}
.stars .off{color:var(--fill)}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.metrics div{background:var(--fill);border-radius:12px;padding:8px 10px}
.metrics b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.metrics span{font-size:12px;color:var(--ink2)}
.tip{margin:10px 0 0;font-size:14px}

/* ---------- boutons, feuilles ---------- */
.btn{height:44px;padding:0 18px;border-radius:14px;background:var(--fill);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{filter:brightness(.92)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.35;pointer-events:none}
#scrim{position:absolute;inset:0;z-index:40;background:rgba(10,15,20,.22);opacity:0;pointer-events:none;transition:opacity .18s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;z-index:41;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;

<script>
'use strict';
const APP_VERSION = "0.6.0";

const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rd = v => Math.round(v * 100) / 100;

/*==PURE-START==*/
/* Noyau sans DOM (testé sous Node) : géométrie, scores, constructions des exercices. */
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const RND = (a, b) => a + Math.random() * (b - a);
const J = a => RND(-a, a);
const pick = a => a[Math.floor(Math.random() * a.length)];

function distPtSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function distPtPoly(p, poly) {
  if (poly.length === 1) return Math.hypot(p[0] - poly[0][0], p[1] - poly[0][1]);
  let m = Infinity;
  for (let i = 1; i < poly.length; i++) {
    const d = distPtSeg(p[0], p[1], poly[i - 1][0], poly[i - 1][1], poly[i][0], poly[i][1]);
    if (d < m) m = d;
  }
  return m;
}
function resample(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [pts[0]];
  let acc = 0, prev = pts[0];
  for (let i = 1; i < pts.length; i++) {
    const cur = pts[i];
    let d = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
    while (acc + d >= step && d > 0) {
      const t = (step - acc) / d;
      const n = [prev[0] + (cur[0] - prev[0]) * t, prev[1] + (cur[1] - prev[1]) * t];
      out.push(n); prev = n;
      d = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]); acc = 0;
    }
    acc += d; prev = cur;
  }
  const last = pts[pts.length - 1], ol = out[out.length - 1];
  if (Math.hypot(last[0] - ol[0], last[1] - ol[1]) > step * 0.25) out.push(last);
  return out;
}

/* ---------- cibles : toutes partagent { samples, closed, marks } ---------- */
function mkTarget(samples, closed, extra) {
  const t = { samples, closed: !!closed };
  if (closed) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of samples) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
    const n = samples.length - 1;
    t.diam = Math.min(x1 - x0, y1 - y0);
    t.center = [(x0 + x1) / 2, (y0 + y1) / 2];
    t.marks = [0, 0.25, 0.5, 0.75].map(f => samples[Math.floor(f * n)]);
  } else t.marks = [samples[0], samples[samples.length - 1]];
  return Object.assign(t, extra || {});
}
function lineTarget(x1, y1, x2, y2) {
  return mkTarget(resample([[x1, y1], [x2, y2]], 6), false, { type: 'line', a: [x1, y1], b: [x2, y2] });
}
function ellipseTarget(cx, cy, rx, ry, rot) {
  const per = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
  const n = Math.max(48, Math.ceil(per / 6)), pts = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const t = i / n * Math.PI * 2, ex = rx * Math.cos(t), ey = ry * Math.sin(t);
    pts.push([cx + ex * c - ey * s, cy + ex * s + ey * c]);
  }
  return mkTarget(pts, true, { type: 'ellipse', c: [cx, cy], rx, ry, rot, diam: 2 * Math.min(rx, ry) });
}
function arcTarget(cx, cy, rx, ry, rot, a0, a1) {
  const n = Math.max(12, Math.ceil(Math.abs(a1 - a0) * (rx + ry) / 2 / 6)), pts = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const t = a0 + (a1 - a0) * i / n, ex = rx * Math.cos(t), ey = ry * Math.sin(t);
    pts.push([cx + ex * c - ey * s, cy + ex * s + ey * c]);
  }
  return mkTarget(pts, false, { type: 'arc' });
}
function catmull(pts, closed, seg = 14) {
  const n = pts.length, out = [], get = i => closed ? pts[(i % n + n) % n] : pts[clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t, f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(closed ? out[0].slice() : pts[n - 1].slice());
  return out;
}
function smoothTarget(pts, closed) {
  const poly = resample(catmull(pts, closed), 6);
  if (closed) {
    const f = poly[0], l = poly[poly.length - 1];
    if (Math.hypot(f[0] - l[0], f[1] - l[1]) > 0.5) poly.push([f[0], f[1]]); else poly[poly.length - 1] = [f[0], f[1]];
  }
  return mkTarget(poly, closed, { type: 'path' });
}
function movAvg(pts, k) {
  const n = pts.length;
  return pts.map((_, i) => {
    const r = Math.min(k, i, n - 1 - i); let x = 0, y = 0;
    for (let j = i - r; j <= i + r; j++) { x += pts[j][0]; y += pts[j][1]; }
    return [x / (2 * r + 1), y / (2 * r + 1)];
  });
}
/* symétrique d'un tracé par rapport à la verticale x = ax (le tracé est lissé avant) */
function mirrorTarget(pts, ax) {
  const sm = movAvg(resample(pts, 6), 2);
  return mkTarget(resample(sm.map(p => [2 * ax - p[0], p[1]]), 6), false, { type: 'path' });
}

/* ---------- scores : tracé ---------- */
function scoreTarget(S, target, tol) {
  const T = target.samples;
  let sum = 0, far = 0;
  for (const p of S) { const d = distPtPoly(p, T); sum += d; if (d > 3 * tol) far++; }
  const mean = sum / S.length;
  let covered = 0;
  for (const q of T) if (distPtPoly(q, S) <= 2 * tol) covered++;
  const cov = covered / T.length, over = far / S.length;
  const acc = clamp(1 - mean / (2.5 * tol), 0, 1);
  let closure = 1;
  if (target.closed) {
    const gap = Math.hypot(S[0][0] - S[S.length - 1][0], S[0][1] - S[S.length - 1][1]);
    closure = 1 - 0.2 * clamp(gap / (0.35 * target.diam), 0, 1);
  }
  const score = 100 * (0.6 * acc + 0.4 * cov) * cov * (1 - 0.6 * over) * closure;
  return { score, acc, cov, over, mean, closure };
}
function scoreExercise(strokePtsList, targets, tol) {
  const items = strokePtsList.map((p, i) => ({ i, r: resample(p, 6) })).filter(o => o.r.length >= 2);
  const pairs = [];
  targets.forEach((t, ti) => items.forEach((o, si) => {
    const r = scoreTarget(o.r, t, tol);
    pairs.push({ ti, si, r, q: r.cov * r.acc });
  }));
  pairs.sort((a, b) => b.q - a.q);
  const tUsed = new Set(), sUsed = new Set(), res = new Array(targets.length).fill(null), matchIdx = new Array(targets.length).fill(-1);
  for (const p of pairs) {
    if (p.q < 0.03) break;
    if (tUsed.has(p.ti) || sUsed.has(p.si)) continue;
    tUsed.add(p.ti); sUsed.add(p.si); res[p.ti] = p.r; matchIdx[p.ti] = items[p.si].i;
  }
  const per = res.map(r => r ? r.score : 0);
  const total = avg(per);
  const got = res.filter(Boolean), n = got.length || 1;
  return {
    total, per, detail: res, matchIdx, extra: items.length - sUsed.size, missing: targets.length - got.length,
    acc: got.reduce((a, r) => a + r.acc, 0) / n, cov: got.reduce((a, r) => a + r.cov, 0) / n, over: got.reduce((a, r) => a + r.over, 0) / n
  };
}

/* ---------- scores : hachures ---------- */
function angMod(a) { a %= Math.PI; return a < 0 ? a + Math.PI : a; }
function angDiff(a, b) { const d = Math.abs(angMod(a) - angMod(b)); return d > Math.PI / 2 ? Math.PI - d : d; }
function axialMean(angs) { let s = 0, c = 0; for (const a of angs) { s += Math.sin(2 * a); c += Math.cos(2 * a); } return angMod(Math.atan2(s, c) / 2); }
function clipSeg(a, b, R) {
  let t0 = 0, t1 = 1; const dx = b[0] - a[0], dy = b[1] - a[1];
  const p = [-dx, dx, -dy, dy], q = [a[0] - R[0], R[2] - a[0], a[1] - R[1], R[3] - a[1]];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return null; }
    else { const t = q[i] / p[i]; if (p[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; } else { if (t < t0) return null; if (t < t1) t1 = t; } }
  }
  return [[a[0] + dx * t0, a[1] + dy * t0], [a[0] + dx * t1, a[1] + dy * t1]];
}
function clipLen(a, b, R) { const s = clipSeg(a, b, R); return s ? Math.hypot(s[1][0] - s[0][0], s[1][1] - s[0][1]) : 0; }
/* p : { angle (deg, y vers le bas) | null, gap, minN, awayFrom (rad) | null, minDiff (deg) } */
function scoreHatch(lists, zone, p) {
  const R = zone.rect, zw = R[2] - R[0], zh = R[3] - R[1], minLen = 0.18 * Math.max(zw, zh), items = [];
  for (const pts of lists) {
    if (pts.length < 2) continue;
    const a = pts[0], b = pts[pts.length - 1];
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const chord = Math.hypot(b[0] - a[0], b[1] - a[1]); if (chord < minLen) continue;
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (mid[0] < R[0] - 40 || mid[0] > R[2] + 40 || mid[1] < R[1] - 40 || mid[1] > R[3] + 40) continue;
    items.push({ a, b, mid, chord, th: angMod(Math.atan2(b[1] - a[1], b[0] - a[0])), str: chord / len });
  }
  const n = items.length;
  if (n < 2) return { total: 0, n, par: 0, reg: 0, dens: 0, ang: 0, str: 0, fill: 0, meanAngle: null, gap: 0, missing: true };
  const th = axialMean(items.map(o => o.th)), d = [Math.cos(th), Math.sin(th)], nx = -d[1], ny = d[0];
  const par = clamp(1 - avg(items.map(o => angDiff(o.th, th))) * 180 / Math.PI / 10, 0, 1);
  const str = clamp((avg(items.map(o => o.str)) - 0.85) / 0.14, 0, 1);
  const offs = items.map(o => o.mid[0] * nx + o.mid[1] * ny).sort((x, y) => x - y), gaps = [];
  for (let i = 1; i < n; i++) gaps.push(offs[i] - offs[i - 1]);
  const gm = avg(gaps), cv = gm > 0 ? Math.sqrt(avg(gaps.map(g => (g - gm) ** 2))) / gm : 1;
  const reg = clamp(1 - cv / 0.55, 0, 1);
  const dens = p.gap ? clamp(1 - Math.abs(gm - p.gap) / (0.8 * p.gap), 0, 1) : 1;
  let angT = 1, angA = 1;
  if (p.angle != null) angT = clamp(1 - angDiff(th, p.angle * Math.PI / 180) * 180 / Math.PI / 15, 0, 1);
  if (p.awayFrom != null) angA = clamp(angDiff(th, p.awayFrom) * 180 / Math.PI / (p.minDiff || 40), 0, 1);
  const ang = Math.min(angT, angA);
  /* étendue utile : on ignore les coins où la corde du rectangle est plus courte que minLen */
  const cs = [[R[0], R[1]], [R[2], R[1]], [R[0], R[3]], [R[2], R[3]]].map(c => c[0] * nx + c[1] * ny);
  const omin = Math.min(...cs), omax = Math.max(...cs);
  let lo = Infinity, hi = -Infinity;
  for (let o = omin; o <= omax; o += 4) {
    const A = [o * nx - d[0] * 2400, o * ny - d[1] * 2400], B = [o * nx + d[0] * 2400, o * ny + d[1] * 2400];
    if (clipLen(A, B, R) >= minLen) { if (o < lo) lo = o; if (o > hi) hi = o; }
  }
  const ext = (hi > lo ? hi - lo : omax - omin) + gm;
  const cov = clamp((offs[n - 1] - offs[0] + gm) / ext / 0.9, 0, 1);
  const cnt = p.minN ? clamp(n / p.minN, 0, 1) : 1;

function buildPathRange(p, from, to, k = 1) {

  get(id) { return DB.get('lib:' + id); },

const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  const today = dayKey();
  if (prog.last !== today) { prog.streak = prog.last === dayKey(Date.now() - 864e5) ? prog.streak + 1 : 1; prog.last = today; }
  prog.hist[today] = (prog.hist[today] || 0) + 1;
  const k = id + ':' + level, b = prog.best[k];

const ptsOf = st => { const a = []; for (let i = 0; i < st.p.length; i += 3) a.push([st.p[i], st.p[i + 1]]); return a; };
const curStrokes = () => S.ex ? S.docs.ex.strokes.filter(s => !S.ex.used.has(s)) : [];

  openSheet(`
    <h2>Timelapse</h2>
    <p class="sub">Ton dessin se rejoue trait par trait (${TL.strokes.length} trait${TL.strokes.length > 1 ? 's' : ''}). L’ordre suit celui où les traits ont été posés.</p>
    <canvas id="tlCv" class="tl-cv"></canvas>
    <div class="tl-ctl"><button class="btn" id="tlPlay" data-tl="play"></button><input type="range" id="tlSl" min="0" max="1000" value="0" aria-label="Position dans la vidéo"><span class="tl-time" id="tlTime"></span></div>
    <div class="row"><label class="t">Durée de la vidéo</label>${segT('dur', [[10, '10 s'], [20, '20 s'], [30, '30 s'], [60, '1 min']])}</div>
    <div class="row"><label class="t">Qualité</label>${segT('res', [[720, '720p'], [1080, '1080p']])}</div>
    <div id="tlStatus" class="updmsg" role="status" aria-live="polite" hidden></div>
    <div class="row btns"><button class="btn primary" id="tlExp" data-tl="export"${can ? '' : ' disabled'}>Exporter la vidéo</button><button class="btn" data-sheet="close">Fermer</button></div>
    ${can ? '' : '<p class="sub" style="margin:6px 0 0">Ce navigateur ne sait pas enregistrer de vidéo : la lecture reste possible.</p>'}`);
  TL.cv = $('#tlCv'); tlSize(); tlRender(0); tlUI(); tlPlayBtn();
}
function tlStatus(msg, cls) { const s = $('#tlStatus'); if (!s) return; s.hidden = !msg; s.className = 'updmsg' + (cls ? ' ' + cls : ''); s.innerHTML = msg || ''; }
async function tlExport() {
  if (TL.exporting) { TL.cancel = true; return; }
  const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'], mime = types.find(t => MediaRecorder.isTypeSupported(t));
  TL.exporting = true; TL.cancel = false; TL.blob = null; TL.playing = false; cancelAnimationFrame(TL.raf);
  const exp = $('#tlExp'); exp.textContent = 'Annuler'; $('#tlPlay').disabled = true; $('#tlSl').disabled = true;
  let rec, stream;
  try {
    stream = TL.cv.captureStream(30); rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: TL.res >= 1080 ? 8e6 : 5e6 } : {});
  } catch (e) { tlStatus('L’enregistrement vidéo a échoué sur cet appareil.', 'err'); TL.exporting = false; exp.textContent = 'Exporter la vidéo'; $('#tlPlay').disabled = false; $('#tlSl').disabled = false; return; }
  const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(res => { rec.onstop = res; });
  TL.t = 0; tlRender(0); rec.start(250); tlStatus('Enregistrement en cours… garde l’app ouverte.', 'busy');
  const t0 = performance.now();
  await new Promise(res => {
    const step = () => {
      if (TL.cancel || !$('#tlCv') || !sheet.classList.contains('open')) { TL.cancel = true; return res(); }
      const t = (performance.now() - t0) / 1000; TL.t = Math.min(t, TL.dur); tlRender(TL.t); tlUI();
      tlStatus(`Enregistrement en cours… ${Math.round(TL.t / TL.dur * 100)} %`, 'busy');
      if (t >= TL.dur) res(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  await new Promise(r => setTimeout(r, 150)); try { rec.stop(); } catch (e) { } await stopped; stream.getTracks().forEach(t => t.stop());
  TL.exporting = false; const cancelled = TL.cancel; TL.cancel = false;
  if (!$('#tlExp') || !sheet.classList.contains('open')) { TL.exporting = false; TL.cancel = false; return; }
  $('#tlExp').textContent = 'Exporter la vidéo'; $('#tlPlay').disabled = false; $('#tlSl').disabled = false; tlPlayBtn();
  const base = ((rec.mimeType || mime || 'video/webm').split(';')[0]) || 'video/webm', blob = new Blob(chunks, { type: base });
  if (cancelled) return tlStatus('Export annulé.');
  if (!blob.size) return tlStatus('La vidéo est vide : réessaie.', 'err');
  TL.blob = blob; tlStatus(`<b>Vidéo prête</b> · ${fmtBytes(blob.size)} · ${base.includes('mp4') ? 'MP4' : 'WebM'}`, 'new');
  const row = $('#tlExp').parentElement; if (!$('#tlSave')) { const sv = document.createElement('button'); sv.className = 'btn primary'; sv.id = 'tlSave'; sv.dataset.tl = 'save'; sv.textContent = 'Enregistrer / Partager'; row.insertBefore(sv, row.firstChild); $('#tlExp').classList.remove('primary'); }
}
sheet.addEventListener('click', e => {
  const b = e.target.closest('button[data-tl],button[data-tset]'); if (!b) return;
  if (b.dataset.tset) {
    if (TL.exporting) return; const k = b.dataset.tset; TL[k] = +b.dataset.val; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    TL.blob = null; const sv = $('#tlSave'); if (sv) { sv.remove(); $('#tlExp').classList.add('primary'); } tlStatus('');
    if (k === 'res') tlSize(); TL.t = Math.min(TL.t, TL.dur); tlRender(TL.t); tlUI(); return;
  }
  const a = b.dataset.tl;
  if (a === 'play') tlPlay(); else if (a === 'export') tlExport();
  else if (a === 'save' && TL.blob) deliverFile(TL.blob, `${slug(S.cur.name) || 'dessin'}-timelapse.${TL.blob.type.includes('mp4') ? 'mp4' : 'webm'}`, 'Timelapse');
});
sheet.addEventListener('input', e => {
  if (e.target.id !== 'tlSl' || TL.exporting) return;
  TL.playing = false; cancelAnimationFrame(TL.raf); TL.t = e.target.value / 1000 * TL.dur; tlRender(TL.t); tlUI(); tlPlayBtn();
});

/* =====================================================================
   Nouveautés : affichées une fois après une mise à jour, consultables dans les réglages
   ===================================================================== */
const CHANGELOG = [
  { v: '0.6.0', date: '30 sept. 2026', items: [
    ['Photo de référence', 'Importe une photo : elle s’affiche en transparence sous ton dessin, en noir et blanc ou en 3 ou 5 tons pour lire les valeurs, avec un miroir pour repérer les erreurs. Bouton « image » en haut.'],
    ['Bouton +', 'Une nouvelle feuille en un geste, au même format que la feuille en cours. Maintiens le bouton pour choisir un autre format.'],
    ['Dessin gestuel', 'Des séances de poses chronométrées (30 s à 5 min) avec tes photos, des mots au hasard, ou sans sujet. Réglages > Outils.'],
    ['Timelapse', 'Rejoue ton dessin trait par trait et exporte la vidéo. Réglages > Outils.'],
    ['Nouveautés', 'Cette fenêtre s’ouvre après chaque mise à jour, et reste consultable dans les réglages.']] },
  { v: '0.5.1', date: '30 sept. 2026', items: [
    ['Recherche de mise à jour', 'Un bouton dans les réglages pour vérifier tout de suite si une nouvelle version existe.'],
    ['Nouvelles icônes', 'Un engrenage pour les réglages, un viseur pour recentrer la feuille.']] },
  { v: '0.5.0', date: '30 sept. 2026', items: [
    ['Pinceaux', 'Marqueur, fusain et aquarelle, dans un sélecteur près du dock.'],
    ['Groupes de calques', 'Glisser-déposer pour réordonner les calques et les ranger dans des groupes.'],
    ['Rotation de la feuille', 'Fais tourner la feuille à deux doigts ; elle s’aimante aux angles droits.'],
    ['Mode main gauche et stockage', 'Les outils passent à droite, et les réglages montrent l’espace utilisé.']] },
  { v: '0.4.0', date: '29 sept. 2026', items: [['Palette et calques', 'Nouvelle palette vive, panneau de calques, verre liquide affiné.']] },
  { v: '0.3.0', date: '28 sept. 2026', items: [['Mes dessins', 'Bibliothèque de dessins enregistrés, sauvegarde .json et police Google Sans.']] },
  { v: '0.2.0', date: '27 sept. 2026', items: [['Exercices par étapes', '21 exercices en 5 paliers, avec une note à chaque étape.']] }
];
const cmpVer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; };
const newsHtml = list => list.map(e => `<div class="news-h">Version ${esc(e.v)}<span class="vtag">${esc(e.date)}</span></div><ul class="news">${e.items.map(([t, d]) => `<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ul>`).join('');
function openNews(since) {
  const list = since ? CHANGELOG.filter(e => cmpVer(e.v, since) > 0 && cmpVer(e.v, APP_VERSION) <= 0).slice(0, 3) : CHANGELOG;
  if (!list.length) return false;
  openSheet(`<h2>${since ? 'Nouveautés' : 'Historique des versions'}</h2><p class="sub">${since ? `Dessiner vient de passer en version ${esc(APP_VERSION)}.` : `Version installée : ${esc(APP_VERSION)}.`}</p>${newsHtml(list)}
    <div class="row btns" style="margin-top:12px"><button class="btn primary" data-sheet="close">${since ? 'C’est noté' : 'Fermer'}</button></div>`);
  return true;
}
/* à décider dès le démarrage, avant toute action : installation neuve (rien à signaler) ou mise à jour d'une version d'avant les nouveautés */
async function initSeenVersion() {
  if (LS.get('seenVersion', null) !== null) return;
  let existing = S.docs.free.strokes.length > 0 || Object.keys(localStorage).some(k => k.startsWith('dessiner_') && k !== 'dessiner_seenVersion' && k !== 'dessiner_updLast');
  if (!existing) { try { existing = (await LIB.list()).length > 0; } catch (e) { } }
  LS.set('seenVersion', existing ? '0.5.1' : APP_VERSION);
}
function maybeShowNews() {
  const seen = LS.get('seenVersion', APP_VERSION), c = cmpVer(seen, APP_VERSION);
  if (c > 0) { LS.set('seenVersion', APP_VERSION); return; }
  if (c === 0) return;
  if (sheet.classList.contains('open') || G) return;    /* on ne passe pas devant une autre fenêtre : ce sera pour la prochaine ouverture */
  openNews(seen); LS.set('seenVersion', APP_VERSION);
}

/* =====================================================================
   Liaison des nouveaux boutons
   ===================================================================== */
function bindExtra() {
  bindNewButton();
  $('#btnRef').onclick = () => setRefOpen(!refOpen);
  sheet.addEventListener('click', e => {
    const b = e.target.closest('button[data-x]'); if (!b) return; const a = b.dataset.x;
    if (G && a !== 'news' && a !== 'timelapse') { flash('Une séance de dessin gestuel est en cours.'); return; }
    closeSheet();
    if (a === 'ref') { if (S.mode !== 'free') setMode('free'); setRefOpen(true); }
    else if (a === 'gesture') openGestureSetup();
    else if (a === 'timelapse') openTimelapse();
    else if (a === 'news') openNews(null);
  });
}

init();
